<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blood Stock | NHR BD</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif;color:#1b2d42;min-height:100vh;background:linear-gradient(115deg,#bfe4fb,#dff1fd 35%,#f4faff 65%,#fff) fixed}
body.bn{font-family:"Hind Siliguri","Plus Jakarta Sans",system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(10,100,170,.1);gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:#0c3b5e}
.lm{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px;background:linear-gradient(135deg,#12b4d8,#0a7fc4)}
.right{display:flex;align-items:center;gap:12px}
.lang{display:flex;gap:2px;padding:3px;background:#e9f1f8;border-radius:999px}
.lang button{border:none;background:none;padding:6px 13px;border-radius:999px;font:inherit;font-size:13px;font-weight:700;color:#5b6b80;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:#0a6fa8}
.out,.back{border:1.5px solid #d9e5f0;background:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;color:#0c3b5e;cursor:pointer;text-decoration:none;font-size:14px}
main{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;font-weight:800;color:#0c3b5e}
.sub{margin:6px 0 22px;color:#5b6b80;font-size:14.5px}
.card{background:#fff;border-radius:20px;padding:20px 22px;margin-bottom:18px;box-shadow:0 14px 34px -18px rgba(10,100,170,.25)}
.card h3{color:#0c3b5e;font-size:17px}
.card small{color:#5b6b80;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.grid label{display:block;text-align:center;font-size:12px;font-weight:800;color:#b3202d;margin-bottom:4px}
.grid input{width:100%;height:42px;text-align:center;border:1.5px solid #d9e5f0;border-radius:10px;font:inherit;font-weight:700;outline:none}
.grid input:focus{border-color:#0a8fc7;box-shadow:0 0 0 3px rgba(10,143,199,.15)}
.save{border:none;border-radius:11px;padding:10px 22px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,#0a86cc,#05609f)}
.empty{text-align:center;padding:40px;color:#5b6b80}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0c3b5e;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600}
[hidden]{display:none!important}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
<style id="nhr-responsive-fix">
  *, *::before, *::after { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  img, svg, canvas, video { max-width: 100%; }
  h1, h2, h3, h4, p, span, label, a, td, th, li, small, strong, b { overflow-wrap: break-word; word-wrap: break-word; }
  @media (max-width: 768px) {
    .top, header, nav { height: auto !important; min-height: 60px; padding: 10px 14px !important; flex-wrap: wrap !important; gap: 8px !important; }
    .hl, .hr, .nav-right, .nav-actions, .actions, .tabs, .pills { flex-wrap: wrap !important; gap: 8px !important; }
    .wrap, .container, .shell, .page, .main, main, .card, .panel, .box, .mcard { width: 100% !important; max-width: 100% !important; }
    .card, .panel, .mcard { padding: 20px 16px !important; border-radius: 18px !important; }
    .grid, .grid2, .grid3, .grid4, .row2, .two-col, .three-col, .cols, .stats, .cards {
      grid-template-columns: 1fr !important;
      gap: 12px !important;
    }
    .idbox, .srow, .setting-row, .item-row, .list-row {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 10px !important;
    }
    .idbox button, .srow button, .setting-row button { width: 100% !important; }
    h1 { font-size: clamp(22px, 6vw, 28px) !important; line-height: 1.28 !important; }
    h2 { font-size: clamp(19px, 5vw, 24px) !important; line-height: 1.3 !important; }
    input, select, textarea { font-size: 16px !important; max-width: 100% !important; }
    button, .btn { min-height: 44px; }
    table { display: block; width: 100%; overflow-x: auto; }
  }
</style>
<script src="nhr-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>
<header class="top">
  <div class="logo"><div class="lm">+</div>NHR BD · <span data-i="head"></span></div>
  <div class="right">
    <div class="lang"><button data-l="en">English</button><button data-l="bn">বাংলা</button></div>
    <button class="out" id="out"></button>
  </div>
</header>
<main>
  <h1 data-i="title"></h1><p class="sub" data-i="sub"></p>
  <div id="list"></div>
</main>
<div id="toast" hidden></div>

<script>
const $=(id)=>document.getElementById(id);
const GROUPS=["A+","A-","B+","B-","AB+","AB-","O+","O-"];
const I18N={
  en:{head:"Blood stock",title:"Hospital blood stock",sub:"Update how many blood bags each hospital has. Patients see these numbers live on their dashboard.",save:"Save",saved:"Saved live to Firestore.",upd:"Updated {d}",never:"Not updated yet",out:"Sign out",err:"Something went wrong.",none:"No hospital or clinic registered yet. An admin has to register one first."},
  bn:{head:"রক্তের মজুত",title:"হাসপাতালের রক্তের মজুত",sub:"প্রতিটি হাসপাতালে কয়টি রক্তের ব্যাগ আছে হালনাগাদ করুন। রোগীরা ড্যাশবোর্ডে এই সংখ্যা লাইভ দেখবেন।",save:"সেভ",saved:"লাইভ সেভ হয়েছে।",upd:"হালনাগাদ {d}",never:"এখনও হালনাগাদ হয়নি",out:"সাইন আউট",err:"কিছু একটা সমস্যা হয়েছে।",none:"দেখানোর মতো কোনো হাসপাতাল বা ক্লিনিক এখনও নিবন্ধিত হয়নি।"}
};
let lang=localStorage.getItem("nhr_lang")==="bn"?"bn":"en";
let H=[];

const t=(k)=>I18N[lang][k]||k;
const esc=(v)=>String(v==null?"":v).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const read=()=>{for(const st of [sessionStorage,localStorage]){try{const v=JSON.parse(st.getItem("nhr_session")||st.getItem("nhr_user")||"null");if(v)return v}catch(e){}}return null};
const ses=read();
if(!ses){location.replace("login.html")}

const toast=(m)=>{const e=$("toast");e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},2500)};
const ago=(iso)=>{const m=Math.floor((Date.now()-new Date(iso))/60000);return Number.isNaN(m)||m<1?(lang==="bn"?"এইমাত্র":"just now"):m<60?m+" min":m<1440?Math.floor(m/60)+" h":Math.floor(m/1440)+" d"};

function render(){
  document.body.classList.toggle("bn",lang==="bn");document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach((e)=>{e.textContent=t(e.dataset.i)});
  document.querySelectorAll(".lang button").forEach((b)=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("out").textContent=t("out");
  const mine=(ses&&(ses.type==="facility"||ses.role==="facility")&&ses.nhrId)?H.filter((h)=>h.id===ses.nhrId||h.facilityId===ses.nhrId):H;
  $("list").innerHTML=mine.length?mine.map((h)=>'<div class="card"><h3>'+esc(h.name)+"</h3><small>"+esc(h.district||"")+" · "+esc(h.type||"Hospital")+" · "+(h.updatedAt?t("upd").replace("{d}",ago(h.updatedAt)):t("never"))+'</small><div class="grid">'+GROUPS.map((g)=>'<div><label>'+g+'</label><input type="number" min="0" max="999" data-h="'+esc(h.id)+'" data-g="'+g+'" value="'+((h.units&&h.units[g])||0)+'"></div>').join("")+'</div><button class="save" data-save="'+esc(h.id)+'">'+t("save")+"</button></div>").join(""):'<p class="empty">'+t("none")+"</p>";
}

document.addEventListener("click",async(e)=>{
  const b=e.target.closest("[data-save]");if(!b)return;
  const id=b.dataset.save,units={};
  document.querySelectorAll('input[data-h="'+id+'"]').forEach((i)=>{units[i.dataset.g]=Math.max(0,parseInt(i.value,10)||0)});
  b.disabled=true;
  try{
    const target=H.find(h=>h.id===id)||{id};
    const updatedAt=new Date().toISOString();
    if(window.db){
      await window.db.collection("hospitals").doc(id).set({
        id,
        name:target.name||id,
        district:target.district||"",
        type:target.type||"Hospital",
        phone:target.phone||"",
        units,
        updatedAt
      },{merge:true});
    }
    if(ses&&ses.token){
      const url=(ses.type==="admin"||ses.role==="admin")?"/api/admin/blood-stock":"/api/facility/blood-stock";
      fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+ses.token},body:JSON.stringify({facilityId:id,units})}).catch(()=>{});
    }
    toast(t("saved"));
  }catch(err){
    toast(t("err"));
  }finally{
    b.disabled=false;
  }
});

document.querySelectorAll(".lang button").forEach((b)=>b.addEventListener("click",()=>{lang=b.dataset.l;localStorage.setItem("nhr_lang",lang);render()}));
$("out").onclick=()=>{try{if(window.auth)auth.signOut()}catch(e){}localStorage.removeItem("nhr_session");sessionStorage.removeItem("nhr_session");localStorage.removeItem("nhr_user");location.href="login.html"};

function startLiveStock(){
  render();
  if(!window.db)return;
  const hospMap=new Map();
  const sync=()=>{H=[...hospMap.values()];render()};
  window.db.collection("hospitals").onSnapshot(snap=>{
    hospMap.clear();
    snap.docs.forEach(d=>hospMap.set(d.id,{...d.data(),id:d.id}));
    sync();
  });
  window.db.collection("facilities").onSnapshot(snap=>{
    snap.docs.forEach(d=>{
      const f=d.data();
      const fid=f.facilityId||d.id;
      if(!hospMap.has(fid)){
        hospMap.set(fid,{id:fid,name:f.name||fid,district:f.district||"",type:f.type||"Hospital",phone:f.phone||"",units:f.units||{},updatedAt:f.updatedAt||""});
      }
    });
    sync();
  });
}
startLiveStock();
</script>
</body>
</html>
