async function pdfFrom(html,file,prep){
  if(!window.html2pdf)return toast(t("pdfErr"));
  const stage=document.createElement("div");stage.className="pdf-stage";stage.innerHTML=html;document.body.appendChild(stage);
  try{
    if(prep)prep(stage);
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    await new Promise((r)=>setTimeout(r,300));
    await html2pdf().set({margin:0,filename:file,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",scrollX:0,scrollY:0},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(stage.firstElementChild).save();
    toast(t("pdfDone"));
  }catch(e){console.error(e);toast(t("pdfErr"))}finally{stage.remove()}
}

function initVitalsChart(){
  if(typeof Chart==="undefined"){toast(t("chartErr"));return}
  if(vChart)vChart.destroy();
  const dates = VITALS.dates && VITALS.dates.length ? VITALS.dates : [];
  const s={bp:[t("vBp"),VITALS.bp||[],"#0a8fc7","rgba(10,143,199,.1)"],glucose:[t("vGlu"),VITALS.glucose||[],"#f59e0b","rgba(245,158,11,.1)"],hba1c:[t("vHba"),VITALS.hba1c||[],"#d92d3a","rgba(217,45,58,.1)"]}[$("vitalsMetric").value];
  let emptyEl = $("vitalsEmptyHint");
  if(!emptyEl){
    emptyEl = document.createElement("p");
    emptyEl.id = "vitalsEmptyHint";
    emptyEl.className = "hint";
    emptyEl.style.cssText = "margin:8px 0 0;text-align:center";
    $("vitalsChart").parentElement.appendChild(emptyEl);
  }
  emptyEl.textContent = dates.length ? "" : (lang === "bn" ? "এখনও কোনো ভাইটাল রিডিং যুক্ত হয়নি। ডাক্তার বা হাসপাতাল/ল্যাব রিপোর্ট দিলে এখানে গ্রাফ দেখা যাবে।" : "No vitals recorded yet. Readings added by your doctor or hospital/lab will appear here automatically.");
  const fmtLbl = (x) => {
    const iso = String(x).length === 7 ? x + "-01T00:00:00" : String(x) + "T00:00:00";
    const d = new Date(iso);
    return isNaN(d.getTime()) ? String(x) : d.toLocaleDateString(loc(), String(x).length === 7 ? { month: "short", year: "2-digit" } : { day: "numeric", month: "short" });
  };
  vChart=new Chart($("vitalsChart").getContext("2d"),{type:"line",data:{labels:dates.map(fmtLbl),datasets:[{label:s[0],data:s[1],borderColor:s[2],backgroundColor:s[3],fill:true,tension:.3,borderWidth:2.5,pointRadius:4,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:"top"}},scales:{y:{beginAtZero:false}}}});
}

/* ===== Doctors & Appointments ===== */
async function loadDocs(){
  try {
    const snap = await db.collection("doctors").get();
    if(!snap.empty){ 
      DOCS = snap.docs.map(d=>({ ...d.data(), id: d.id })); 
      renderDoctors(); 
      return; 
    }
  } catch(e){}
  DOCS = [];
  renderDoctors();
}

async function loadAppts(){
  if(!P) return;
  try {
    const snap = await db.collection("appointments").where("patientNhr", "==", P.nhrId || P.nid).get();
    if(!snap.empty){ 
      MYAPPTS = snap.docs.map(d=>({ ...d.data(), id: d.id })); 
      renderAppts(); 
      return; 
    }
  } catch(e){
    console.warn("Firestore appointments fetch failed:", e);
  }
  MYAPPTS = [];
  renderAppts();
}

async function loadNotifs(){

  try {
    const snap = await db.collection("notifications").where("userId", "==", uid).get();

        b.classList.remove("ring");

let ALL_DONORS = [];

async function loadDonor(){
  const uid = (P && (P.uid || P.nhrId || P.nid)) || (auth.currentUser && auth.currentUser.uid);
  if(!uid) return;
  try {
    const doc = await db.collection("donors").doc(uid).get();
    if(doc.exists){
      DONOR = doc.data();
      DONOR_NEXT = DONOR.lastDonation ? addDays(DONOR.lastDonation, 90) : null;
      if (DONOR_NEXT && DONOR_NEXT <= todayStr()) DONOR_NEXT = null;
    } else {
      DONOR = null;
      DONOR_NEXT = null;
    }
    renderDonor();
    renderReqs();
  } catch(e){ console.error("Donor fetch error:", e); }
}

async function loadReqs(){
  try {
    const snap = await db.collection("blood_requests").get();
    const myId = P && (P.nhrId || P.nid || P.uid);
    REQS = snap.docs
      .map(d => ({ ...d.data(), id: d.id, mine: d.data().userId === myId, responded: Array.isArray(d.data().responders) && d.data().responders.some(r => r.uid === myId || r.userId === myId) }))
      .filter(r => r.status !== "closed")
      .sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));

}

function runDonorFilter(g, d) {
  const myId = P && (P.uid || P.nhrId || P.nid);
  bdGroup = g;
  bdList = ALL_DONORS
    .filter(u => u.active !== false && u.uid !== myId && CAN[g].includes(u.group || u.bloodGroup) && (!d || u.district === d))
    .map(u => {
      const nextDate = u.lastDonation ? addDays(u.lastDonation, 90) : null;
      const isReady = u.available !== false && (!nextDate || nextDate <= todayStr());
      return { ...u, ref: u.uid || u.id, available: isReady, nextDate: isReady ? null : nextDate, exact: (u.group || u.bloodGroup) === g };
    })
    .sort((a, b) => (b.exact - a.exact) || (Number(b.available) - Number(a.available)));
  renderBdResults();
}

async function toggleDonor(on){
  const uid = P.uid || P.nhrId || P.nid;
  const cooldownNext = DONOR && DONOR.lastDonation ? addDays(DONOR.lastDonation, 90) : null;
  const stillCooling = !!(cooldownNext && cooldownNext > todayStr());
  const donorObj = {
    uid,
    userId: P.nhrId || P.nid || uid,
    name: P.fullName,
    fullName: P.fullName,
    phone: P.phone || "",
    email: P.email || "",
    group: P.bloodGroup || "",
    bloodGroup: P.bloodGroup || "",
    district: P.district || "",
    active: on,
    available: on ? !stillCooling : false,
    showPhone: DONOR ? DONOR.showPhone !== false : true,
    showEmail: DONOR ? DONOR.showEmail === true : false,
    donations: (DONOR && DONOR.donations) || 0,
    lastDonation: (DONOR && DONOR.lastDonation) || "",

        transaction.set(donorRef, {

          userId: P.nhrId || P.nid || donorId,
          name: P.fullName || oldData.name || "",
          fullName: P.fullName || oldData.fullName || "",

          district: P.district || oldData.district || "",
          group: P.bloodGroup || oldData.group || "",
          bloodGroup: P.bloodGroup || oldData.bloodGroup || "",
          lastDonation: latestDate,
          available: daysSinceLatest >= 90,
          donations: oldCount + (historySnap.exists ? 0 : 1),
          updatedAt: new Date().toISOString()
        }, { merge: true });
        if(!historySnap.exists) {
          transaction.set(historyRef, {
            donorId, userId: P.nhrId || P.nid || donorId,
            bloodGroup: P.bloodGroup || "", donationDate: d,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

let LIVE_UNSUBS = [];
function stopLiveSync() {
  LIVE_UNSUBS.forEach(fn => { try { fn(); } catch(e) {} });
  LIVE_UNSUBS = [];
}
function startLiveSync() {
  stopLiveSync();
  if (!P || !window.db) return;
  const uid = P.uid || P.nhrId || P.nid;
  const nhrKey = P.nhrId || P.nid || uid;

  // 1. Live User Profile
  if (P.uid) {
    LIVE_UNSUBS.push(db.collection("users").doc(P.uid).onSnapshot(snap => {
      if (!snap.exists) return;
      const d = snap.data();
      P = { ...P, ...d, uid: snap.id };
      P.dob = P.dob || P.dateOfBirth || "";
      P.bloodGroup = P.bloodGroup || P.health?.bloodGroup || "";
      P.emergency = (P.emergency && P.emergency.name) ? P.emergency : ((P.emergencyContact && P.emergencyContact.name) ? P.emergencyContact : ((P.health && P.health.emergencyContact && P.health.emergencyContact.name) ? P.health.emergencyContact : { name: "", relation: "", phone: "" }));
      P.address = typeof P.address === "string" ? P.address : P.address?.details || "";
      P.district = P.district || P.addressInfo?.district || "";
      P.division = P.division || P.addressInfo?.division || "";
      render();
    }));
  }

  // 2. Live My Donor Profile
  if (uid) {
    LIVE_UNSUBS.push(db.collection("donors").doc(uid).onSnapshot(doc => {
      if (doc.exists) {
        DONOR = doc.data();
        const nextD = DONOR.lastDonation ? addDays(DONOR.lastDonation, 90) : null;
        DONOR_NEXT = (nextD && nextD > todayStr()) ? nextD : null;
      } else {
        DONOR = null;
        DONOR_NEXT = null;
      }
      renderDonor();
      renderReqs();
    }));
  }

  // 3. Live Active Donors Directory
  LIVE_UNSUBS.push(db.collection("donors").where("active", "==", true).onSnapshot(snap => {
    ALL_DONORS = snap.docs.map(doc => ({ ...doc.data(), uid: doc.id }));
    if (bdGroup) runDonorFilter(bdGroup, $("bdDistrict").value);
  }));

  // 4. Live Blood Requests
  LIVE_UNSUBS.push(db.collection("blood_requests").onSnapshot(snap => {
    const myId = P.nhrId || P.nid || P.uid;
    REQS = snap.docs
      .map(d => ({
        ...d.data(),
        id: d.id,
        mine: d.data().userId === myId || d.data().requesterUid === P.uid,
        responded: Array.isArray(d.data().responders) && d.data().responders.some(r => r.uid === myId || r.uid === P.uid || r.userId === myId)
      }))
      .filter(r => r.status !== "closed")
      .sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
    renderReqs();
  }));

  // 5. Live Hospitals & Blood Stock
  LIVE_UNSUBS.push(db.collection("hospitals").onSnapshot(snap => {
    HOSP = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    renderHospitals();
  }));

  // 6. Live Doctors List
  LIVE_UNSUBS.push(db.collection("doctors").onSnapshot(snap => {
    DOCS = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    renderDoctors();
  }));

  // 7. Live Appointments
  if (nhrKey) {
    LIVE_UNSUBS.push(db.collection("appointments").where("patientNhr", "==", nhrKey).onSnapshot(snap => {
      MYAPPTS = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      renderAppts();
    }));

    // 8. Live Medical Records, Vitals, Allergies, Conditions, Audit Logs
    LIVE_UNSUBS.push(db.collection("records").where("nhrId", "==", nhrKey).onSnapshot(snap => {
      REC.records = snap.docs.map(d => d.data());
      render();
    }));
    const cleanNhr = String(P.nhrId || "").replace(/[^A-Z0-9]/gi, "");
    const dashNhr = cleanNhr.startsWith("NHR") && cleanNhr.length > 3 ? "NHR-" + cleanNhr.slice(3) : cleanNhr;
    const vKeys = [...new Set([P.nhrId, cleanNhr, dashNhr, P.nid, nhrKey].filter(Boolean))];
    const vDocs = {};
    vKeys.forEach(vk => {
      LIVE_UNSUBS.push(db.collection("vitals").doc(vk).onSnapshot(vSnap => {
        if (vSnap.exists) vDocs[vk] = vSnap.data();
        else delete vDocs[vk];
        const chosen = vDocs[P.nhrId] || vDocs[P.nid] || vDocs[nhrKey] || { dates: [], bp: [], glucose: [], hba1c: [] };
        VITALS = chosen;
        initVitalsChart();
      }));
    });
    LIVE_UNSUBS.push(db.collection("allergies").where("nhrId", "==", nhrKey).onSnapshot(snap => {
      REC.allergies = snap.docs.map(d => d.data());
      render();
    }));
    LIVE_UNSUBS.push(db.collection("conditions").where("nhrId", "==", nhrKey).onSnapshot(snap => {
      REC.conditions = snap.docs.map(d => d.data().name);
      render();
    }));
    LIVE_UNSUBS.push(db.collection("audit_logs").where("patientId", "==", nhrKey).onSnapshot(snap => {
      DON_AUDIT = snap.docs.map(d => d.data());
      render();
    }));
  }

  // 9. Live Notifications
  if (uid) {
    LIVE_UNSUBS.push(db.collection("notifications").where("userId", "==", uid).onSnapshot(snap => {
      NOTIFS = snap.docs.map(d => d.data()).sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")));
      UNREAD = NOTIFS.filter(n => !n.read).length;
      if (lastUnread >= 0 && UNREAD > lastUnread && NOTIFS[0]) {
        toast("🔔 " + L(NOTIFS[0].text));
        const b = $("notifBtn");
        if (b) { b.classList.remove("ring"); void b.offsetWidth; b.classList.add("ring"); }
      }
      lastUnread = UNREAD;
      renderNotifs();
    }));
  }
}

/* ===== Real-Time Firebase Auth & Sync Initialization ===== */
/* ===== Real-Time Firebase Auth & Sync Initialization ===== */
auth.onAuthStateChanged(async (user) => {
  const activeSes = readSession() || ses;
  P = null;

  if (user && activeSes && activeSes.uid && user.uid !== activeSes.uid) {
    try { await auth.signOut(); } catch (e) {}
    user = null;
  }

  if (user) {
    try {
      const doc = await db.collection("users").doc(user.uid).get();
      if (doc.exists) {
        const uData = doc.data();
        if (activeSes && activeSes.nid && uData.nid && uData.nid !== activeSes.nid) {
          try { await auth.signOut(); } catch (e) {}
          user = null;
        } else {
          P = uData;
          P.uid = user.uid;
        }
      }
    } catch(e) {
      console.error("User fetch error:", e);
    }
  }

  if (!P && activeSes && (activeSes.token || activeSes.uid || activeSes.nid || activeSes.nhrId)) {
    try {
      const me = await api("/api/me", null, "GET");
      if (me.ok && me.data) {
        P = me.data.user || me.data;
      } else if (me.status === 401) {
        clearSession();
        location.replace("login.html");
        return;
      }
    } catch(e) {}

    try {
      let docSnap = null;
      if (activeSes.uid) {
        const d = await db.collection("users").doc(activeSes.uid).get();
        if (d.exists) docSnap = d;
      }
      if (!docSnap && activeSes.nid) {
        const qSnap = await db.collection("users").where("nid", "==", activeSes.nid).limit(1).get();
        if (!qSnap.empty) docSnap = qSnap.docs[0];
      }
      if (docSnap) {
        P = { ...(P || {}), ...docSnap.data(), uid: docSnap.id };
      }
    } catch(e) {
      console.error("Fallback user fetch error:", e);
    }

    if (!P) {
      P = {
        uid: activeSes.uid || "",
        nid: activeSes.nid || "",
        nhrId: activeSes.nhrId || "",
        fullName: activeSes.name || "",
        name: activeSes.name || "",
        email: activeSes.email || "",
        role: activeSes.role || "patient"
      };
    }
  }

  if (!P) {
    clearSession();
    location.replace("login.html");
    return;
  }

  if (P) {
    P.dob = P.dob || P.dateOfBirth || "";
    P.bloodGroup = P.bloodGroup || P.health?.bloodGroup || "";
    P.emergency = (P.emergency && P.emergency.name) ? P.emergency : ((P.emergencyContact && P.emergencyContact.name) ? P.emergencyContact : ((P.health && P.health.emergencyContact && P.health.emergencyContact.name) ? P.health.emergencyContact : { name: "", relation: "", phone: "" }));
    P.address = typeof P.address === "string" ? P.address : P.address?.details || "";
    P.district = P.district || P.addressInfo?.district || "";
    P.division = P.division || P.addressInfo?.division || "";
  }

  if (P) {
    prefs = { ...prefs, ...(P.prefs || {}) };
    render();
    initVitalsChart();
    if (P.district) $("hsDistrict").value = P.district;
    startLiveSync();
  }
});
</script>
