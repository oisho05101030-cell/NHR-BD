<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | NHR BD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Firebase Core SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    :root {
      --navy: #0c3b5e; --blue: #0a8fc7; --blue-d: #0562a8; --line: #cfdbe8;
      --text: #1b2d42; --muted: #5b6b80; --err: #d92d3a; --ok: #12a150;
      --font: "Plus Jakarta Sans", "Hind Siliguri", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    
    body {
      font-family: var(--font); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased;
      background: radial-gradient(700px 500px at 8% 30%, rgba(120,200,245,.55), transparent 70%),
                  linear-gradient(115deg, #bfe4fb 0%, #dff1fd 35%, #f4faff 65%, #fff 100%);
      background-attachment: fixed;
    }
    body.bn { font-family: "Hind Siliguri", "Plus Jakarta Sans", system-ui, sans-serif; }
    body.bn h1, body.bn h2 { letter-spacing: 0; line-height: 1.25; }
    body.bn .badge { letter-spacing: 0; font-size: 13px; }
    svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    a { color: var(--blue); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 3px solid rgba(10,143,199,.45); outline-offset: 2px; }

    /* ---------- Animations ---------- */
    .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .55; z-index: -1; pointer-events: none; }
    .b1 { width: 380px; height: 380px; background: #8fd3f8; top: 10%; left: -90px; animation: drift1 14s ease-in-out infinite alternate; }
    .b2 { width: 320px; height: 320px; background: #b6e4ff; bottom: 4%; left: 36%; animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(90px, 70px) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-90px, -50px) scale(1.2); } }
    .rise, .slide { opacity: 0; animation-duration: .8s; animation-timing-function: cubic-bezier(.2,.8,.2,1); animation-fill-mode: forwards; animation-delay: calc(var(--d, 0) * 1ms); }
    .rise { transform: translateY(22px); animation-name: rise; }
    .slide { transform: translateX(-30px); animation-name: rise; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes shine { to { background-position: 200% center; } }
    @keyframes rot { to { transform: rotate(360deg); } }

    /* ---------- Header ---------- */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 14px 60px; background: rgba(255,255,255,.82); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(10,100,170,.08); }
    .logo { display: flex; align-items: center; gap: 14px; }
    .logo-mark { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-size: 26px; background: linear-gradient(135deg,#12b4d8,#0a7fc4); box-shadow: 0 8px 18px -6px rgba(10,127,196,.6); }
    .logo-mark svg.i { stroke-width: 3; }
    .logo b { display: block; font-size: 22px; font-weight: 800; color: var(--navy); letter-spacing: -.02em; line-height: 1.1; }
    .logo b span { color: #0a82c4; }
    .logo small { font-size: 12.5px; color: var(--muted); font-weight: 500; }
    .right { display: flex; align-items: center; gap: 14px; }
    .lang { display: flex; gap: 2px; padding: 3px; background: #e9f1f8; border-radius: 999px; border: 1px solid #d3e3f0; }
    .lang button { border: none; background: none; padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 13.5px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all .2s; }
    .lang button[aria-pressed=true] { background: #fff; color: #0a6fa8; box-shadow: 0 1px 4px rgba(10,100,170,.2); }
    .portal-pill { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: #e6f4fc; border: 1px solid #b9dcf3; color: #0a6fa8; font-size: 14px; font-weight: 700; }

    /* ---------- Left side ---------- */
    .page { max-width: 1180px; margin: 0 auto; padding: 56px 32px 64px; display: grid; grid-template-columns: minmax(0,1fr) 430px; column-gap: 72px; grid-template-areas: "hero card" "features card"; align-content: center; align-items: start; min-height: calc(100vh - 75px); }
    .hero { grid-area: hero; align-self: end; padding-bottom: 20px; }
    .features { grid-area: features; display: grid; gap: 14px; align-self: start; }
    .card-wrap { grid-area: card; align-self: center; }
    .badge { display: inline-flex; padding: 8px 20px; border-radius: 999px; background: #fff; border: 1px solid #dbe9f5; box-shadow: 0 2px 8px rgba(10,100,170,.06); font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #0a6fa8; text-transform: uppercase; }
    h1 { margin-top: 26px; font-size: 52px; line-height: 1.05; font-weight: 800; letter-spacing: -.035em; color: var(--navy); }
    h1 .line { display: block; opacity: 0; transform: translateY(26px); animation: rise .8s cubic-bezier(.2,.8,.2,1) .25s forwards; }
    h1 .l2 {
      animation: rise .8s cubic-bezier(.2,.8,.2,1) .42s forwards, shine 6s linear 1.3s infinite;
      background: linear-gradient(90deg,#0a8fc7,#12b4d8,#0562a8,#0a8fc7); background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    }
    .hero p { margin-top: 22px; max-width: 470px; font-size: 17px; line-height: 1.6; color: var(--muted); }
    .beat { width: min(430px, 100%); height: 56px; margin-top: 20px; overflow: visible; }
    .beat path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .beat .base { stroke: #c4e1f2; stroke-width: 2.5; }
    .beat .run { stroke: #0a8fc7; stroke-width: 3.2; stroke-dasharray: 70 330; filter: drop-shadow(0 0 5px rgba(10,143,199,.6)); animation: run 2.8s linear infinite; }
    @keyframes run { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
    .feat { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 18px; background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 6px 20px -10px rgba(10,100,170,.18); transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, background .3s; }
    .feat:hover { transform: translateX(8px); background: rgba(255,255,255,.96); box-shadow: 0 16px 30px -12px rgba(10,100,170,.3); }
    .feat .ic { width: 46px; height: 46px; border-radius: 13px; background: #dff0fb; color: #0a86c4; display: grid; place-items: center; font-size: 23px; flex: none; transition: transform .35s cubic-bezier(.34,1.56,.64,1), background .3s, color .3s; }
    .feat:hover .ic { transform: scale(1.12) rotate(-6deg); background: #0a86cc; color: #fff; }
    .feat b { display: block; font-size: 16px; font-weight: 700; color: var(--navy); }
    .feat span { font-size: 13.5px; color: var(--muted); }

    /* ---------- Sign-in card ---------- */
    .card { background: #fff; border-radius: 28px; padding: 36px 34px 30px; box-shadow: 0 30px 60px -20px rgba(10,90,150,.22), 0 0 0 1px rgba(10,100,170,.04); }
    .card h2 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; color: var(--navy); }
    .card .sub { margin: 6px 0 24px; font-size: 14.5px; line-height: 1.5; color: var(--muted); }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
    .input-row { display: flex; align-items: center; gap: 12px; }
    .input-row > svg.i { font-size: 24px; color: var(--navy); }
    .box { position: relative; flex: 1; }
    .box input { width: 100%; height: 48px; padding: 0 16px; font: inherit; font-size: 15px; color: var(--text); background: #f8fbfe; border: 1.5px solid var(--line); border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s, background .15s; }
    .box input::placeholder { color: #8fa0b5; }
    .box input:focus { background: #fff; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(10,143,199,.15); }
    .box input.invalid { border-color: var(--err); background: #fff6f6; }
    .box.pw input { padding-right: 70px; }
    .show { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 700; color: var(--blue); padding: 6px; }
    .err { font-size: 13px; color: var(--err); margin: 6px 0 0 36px; line-height: 1.45; }
    .err:empty { display: none; }
    .detect { display: none; align-items: center; gap: 8px; margin: 8px 0 0 36px; padding: 5px 12px; border-radius: 999px; background: #e6f4fc; border: 1px solid #b9dcf3; color: #0a6fa8; font-size: 12.5px; font-weight: 700; }
    .detect.on { display: inline-flex; animation: rise .3s both; }
    .detect::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 22px; font-size: 13.5px; }
    .chk { display: flex; align-items: center; gap: 9px; cursor: pointer; }
    .chk input { width: 17px; height: 17px; accent-color: var(--blue-d); cursor: pointer; }
    .btn { width: 100%; height: 52px; border: none; border-radius: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font: inherit; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(90deg,#0a86cc,#05609f); box-shadow: 0 12px 24px -10px rgba(5,96,159,.7); transition: transform .12s, box-shadow .12s; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 28px -10px rgba(5,96,159,.75); }
    .btn:disabled { opacity: .75; cursor: not-allowed; transform: none; }
    .btn svg.i { font-size: 18px; stroke-width: 2.4; }
    .btn-fp, .btn-ghost { background: #fff; color: #0a6fa8; border: 1.5px solid #b9dcf3; box-shadow: none; }
    .btn-fp { margin-top: 12px; }
    .btn-fp:hover, .btn-ghost:hover { background: #f1f9fe; box-shadow: none; }
    .btn-fp svg.i { font-size: 22px; stroke-width: 1.8; }
    .or { display: flex; align-items: center; gap: 12px; margin-top: 16px; color: #8fa0b5; font-size: 12.5px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: #e6edf4; }
    .spin { display: none; width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; }
    .btn.loading .spin { display: inline-block; }
    .btn.loading svg.i { display: none; }
    .alert { display: none; padding: 11px 14px; border-radius: 12px; font-size: 13.5px; margin-top: 18px; border-left: 4px solid; line-height: 1.5; }
    .alert.error { display: block; background: #fff4f4; color: #a61b27; border-color: var(--err); }
    .alert.success { display: block; background: #edfbf3; color: #0c7a3d; border-color: var(--ok); }
    .signup { text-align: center; margin-top: 22px; font-size: 14.5px; color: var(--muted); }
    .privacy { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; padding-top: 18px; border-top: 1px solid #e6edf4; font-size: 12.5px; color: var(--muted); }
    .privacy svg.i { font-size: 15px; }

    /* ---------- Phone fingerprint window ---------- */
    .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(12,59,94,.45); backdrop-filter: blur(5px); animation: rise .25s both; }
    .mcard { width: 100%; max-width: 380px; background: #fff; border-radius: 26px; padding: 28px 26px 24px; text-align: center; box-shadow: 0 30px 70px -20px rgba(0,0,0,.4); }
    .mcard h3 { font-size: 20px; font-weight: 800; color: var(--navy); }
    .mcard p { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--muted); }
    .qrbox { display: inline-block; margin: 18px 0 12px; padding: 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 18px; box-shadow: 0 8px 16px -4px rgba(10,100,170,.1); }
    .qrbox img, .qrbox canvas { display: block; }
    .warn { font-size: 12.5px; color: #6a5200; background: #fff8e1; border: 1px solid #f3dd9b; border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; text-align: left; }
    .fpstat { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: #e6f4fc; color: #0a6fa8; font-size: 13px; font-weight: 700; margin-bottom: 16px; }
    .mini { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #b9dcf3; border-top-color: #0a86cc; animation: rot .8s linear infinite; }

    @media (max-width: 1020px) {
      .header { padding: 12px 20px; }
      .page { grid-template-columns: minmax(0,1fr); grid-template-areas: "hero" "card" "features"; row-gap: 28px; padding: 32px 20px 48px; min-height: 0; max-width: 560px; }
      .hero { padding-bottom: 0; }
      h1 { font-size: 38px; margin-top: 20px; }
      .hero p { font-size: 15.5px; margin-top: 14px; }
      .badge { font-size: 11px; padding: 7px 14px; }
    }
    @media (max-width: 560px) { .portal-pill, .logo small { display: none; } .card { padding: 28px 20px 24px; border-radius: 22px; } h1 { font-size: 32px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
<style id="nhr-responsive-fix">
  *, *::before, *::after { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  img, svg, canvas, video { max-width: 100%; }
  h1, h2, h3, h4, p, span, label, a, td, th, li, small, strong, b { overflow-wrap: break-word; word-wrap: break-word; }
  @media (max-width: 768px) {
    .top, header, nav { height: auto !important; min-height: 60px; padding: 10px 14px !important; flex-wrap: wrap !important; gap: 8px !important; }
    .hl, .hr, .nav-right, .nav-actions, .actions, .tabs, .pills { flex-wrap: wrap !important; gap: 8px !important; }
    .wrap, .container, .shell, .page, .main, main, .card, .panel, .box, .mcard { width: 100% !important; max-width: 100% !important; }
    .card, .panel, .mcard { padding: 20px 16px !important; border-radius: 18px !important; }
    .grid, .grid2, .grid3, .grid4, .row2, .two-col, .three-col, .cols, .stats, .cards {
      grid-template-columns: 1fr !important;
      gap: 12px !important;
    }
    .idbox, .srow, .setting-row, .item-row, .list-row {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 10px !important;
    }
    .idbox button, .srow button, .setting-row button { width: 100% !important; }
    h1 { font-size: clamp(22px, 6vw, 28px) !important; line-height: 1.28 !important; }
    h2 { font-size: clamp(19px, 5vw, 24px) !important; line-height: 1.3 !important; }
    input, select, textarea { font-size: 16px !important; max-width: 100% !important; }
    button, .btn { min-height: 44px; }
    table { display: block; width: 100%; overflow-x: auto; }
  }
</style>
<script src="nhr-config.js"></script>
</head>

<body>
  <div class="blob b1"></div><div class="blob b2"></div>

  <header class="header">
    <div class="logo">
      <div class="logo-mark"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
      <div><b>NHR <span>BD</span></b><small data-i="brandSub">National Health Record</small></div>
    </div>
    <div class="right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-l="en">English</button>
        <button type="button" data-l="bn">বাংলা</button>
      </div>
      <div class="portal-pill">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
        <span data-i="portal">Digital Health Portal</span>
      </div>
    </div>
  </header>

  <div class="page">
    <section class="hero">
      <span class="badge rise" style="--d:100" data-i="badge"></span>
      <h1><span class="line l1" data-i="h1a"></span><span class="line l2" data-i="h1b"></span></h1>
      <p class="rise" style="--d:600" data-i="heroP"></p>
      <svg class="beat rise" style="--d:760" viewBox="0 0 400 56" aria-hidden="true">
        <path class="base" d="M0 28 H105 L120 28 L134 6 L154 50 L170 28 H250 L262 28 L274 16 L286 40 L296 28 H400" />
        <path class="run" pathLength="400" d="M0 28 H105 L120 28 L134 6 L154 50 L170 28 H250 L262 28 L274 16 L286 40 L296 28 H400" />
      </svg>
    </section>

    <section class="features">
      <div class="feat slide" style="--d:900">
        <div class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6M9 9h2"/></svg></div>
        <div><b data-i="f1t"></b><span data-i="f1d"></span></div>
      </div>
      <div class="feat slide" style="--d:1060">
        <div class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
        <div><b data-i="f2t"></b><span data-i="f2d"></span></div>
      </div>
      <div class="feat slide" style="--d:1220">
        <div class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.5 3-6 7-6s7 2.5 7 6M16 11l2 2 4-4"/></svg></div>
        <div><b data-i="f3t"></b><span data-i="f3d"></span></div>
      </div>
    </section>

    <div class="card-wrap">
      <main class="card rise" style="--d:300">
        <h2 data-i="signin">Sign In</h2>
        <p class="sub" data-i="sub"></p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="idNumber" data-i="idLabel">ID number</label>
            <div class="input-row">
              <svg class="i" id="icoNid" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.5-1.5 1.7-2 3-2s2.5.5 3 2M14 10h4M14 14h4"/></svg>
              <svg class="i" id="icoDoc" viewBox="0 0 24 24" hidden><path d="M5 3v6a4 4 0 008 0V3M3 3h4M11 3h4M9 13v2a5 5 0 0010 0v-2"/><circle cx="19" cy="11" r="2"/></svg>
              <svg class="i" id="icoBrn" viewBox="0 0 24 24" hidden><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6M9 9h2"/></svg>
              <div class="box"><input type="text" id="idNumber" maxlength="20" data-ph="idPh" autocomplete="username" autocapitalize="characters" /></div>
            </div>
            <div class="detect" id="detect"></div>
            <div class="err" id="idNumberError"></div>
          </div>

          <div class="field">
            <label for="password" data-i="pwLabel">Password</label>
            <div class="input-row">
              <svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"/></svg>
              <div class="box pw">
                <input type="password" id="password" data-ph="pwPh" autocomplete="current-password" />
                <button type="button" class="show" id="togglePw"></button>
              </div>
            </div>
            <div class="err" id="passwordError"></div>
          </div>

          <div class="row">
            <label class="chk"><input type="checkbox" id="remember" /> <span data-i="remember">Remember me</span></label>
            <a href="forgot-password.html" id="forgot" data-i="forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn" id="submitBtn">
            <span class="spin"></span><span id="btnText" data-i="signinBtn">Sign In</span>
            <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>

          <div class="or" data-i="or">or</div>
          <button type="button" class="btn btn-fp" id="fpBtn">
            <svg class="i" viewBox="0 0 24 24"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
            <span data-i="fpPhone">Sign in with fingerprint (phone)</span>
          </button>

          <div id="alert" class="alert" role="alert"></div>

        roleMismatch: "এই সাইন ইন আপনার দেওয়া আইডির সাথে মেলেনি। অনুগ্রহ করে সাপোর্টে যোগাযোগ করুন।",

    let lang = localStorage.getItem("nhr_lang") === "bn" ? "bn" : "en";
    const t = (k, v) => {
      let s = (I18N[lang][k] ?? I18N.en[k] ?? k);
      if (v) for (const x in v) s = s.replace("{" + x + "}", v[x]);
      return s;
    };
    function applyLang() {
      document.documentElement.lang = lang;
      document.body.classList.toggle("bn", lang === "bn");
      document.title = t("title");
      document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
      document.querySelectorAll("[data-ph]").forEach(el => { el.placeholder = t(el.dataset.ph); });
      document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
      $("togglePw").textContent = t($("password").type === "password" ? "show" : "hide");
      renderChip();
    }
    document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
      lang = b.dataset.l; localStorage.setItem("nhr_lang", lang);
      clearAlert(); document.querySelectorAll(".err").forEach(e => { e.textContent = ""; });
      document.querySelectorAll("input.invalid").forEach(i => i.classList.remove("invalid"));
      applyLang();
    }));

    /* ================= Helpers & UI Handling ================= */
    const TYPES = {
      nid:    { chip: "chipNid", icon: "icoNid", opens: "opensNid" },
      doctor: { chip: "chipDoc", icon: "icoDoc", opens: "opensDoc" },
      brn:    { chip: "chipBrn", icon: "icoBrn", opens: "opensBrn" },
      facility: { chip: "chipFac", icon: "icoBrn", opens: "opensFac" },
      admin:  { chip: null,      icon: "icoNid", opens: "opensAdm" }
    };
    function clearAlert() { $("alert").className = "alert"; $("alert").textContent = ""; }
    function setError(id, key) { $(id + "Error").textContent = key ? t(key) : ""; $(id).classList.toggle("invalid", !!key); }

    const normId = (raw) => raw.trim().toUpperCase();
    function detect(raw) {
      const v = normId(raw);
      if (/^DOC\d{8}$/.test(v)) return "doctor";
      if (/^ADM\d{8}$/.test(v)) return "admin";
      if (/^L\d{8}$/.test(v)) return "facility";
      if (/^B\d+$/.test(v)) return "brn";
      if (/^\d{16}$/.test(v)) return "nid";
      return null;
    }
    function renderChip() {
      const type = detect($("idNumber").value), info = type && TYPES[type], chip = $("detect");
      chip.classList.toggle("on", !!(info && info.chip));
      if (info && info.chip) chip.textContent = t(info.chip);
      ["icoNid", "icoDoc", "icoBrn"].forEach(i => { $(i).hidden = i !== (info ? info.icon : "icoNid"); });
    }

    $("idNumber").addEventListener("input", (e) => {
      let v = e.target.value.toUpperCase();
      if (v.startsWith("DOC")) {
        v = "DOC" + v.slice(3).replace(/\D/g, "").slice(0, 8);
      } else if (v.startsWith("ADM")) {
        v = "ADM" + v.slice(3).replace(/\D/g, "").slice(0, 8);
      } else if (v.startsWith("L")) {
        v = "L" + v.slice(1).replace(/\D/g, "").slice(0, 8);
      } else if (/^[A-Z]/.test(v)) {
        v = v.replace(/[^A-Z0-9]/g, "").slice(0, 11);
      } else {
        v = v.replace(/\D/g, "").slice(0, 16);
      }
      e.target.value = v;
      renderChip();
      if (detect(v)) setError("idNumber", "");
    });

    $("togglePw").addEventListener("click", () => {
      $("password").type = $("password").type === "password" ? "text" : "password";
      $("togglePw").textContent = t($("password").type === "password" ? "show" : "hide");
    });

    applyLang();
  </script>
