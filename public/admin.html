<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin | NHR BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<!-- Firebase SDKs Integration -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
:root{--navy:#0c3b5e;--blue:#0a8fc7;--line:#d9e5f0;--text:#1b2d42;--muted:#5b6b80;--err:#d92d3a;--ok:#12a150;--warn:#d97706;--font:"Plus Jakarta Sans","Hind Siliguri","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;background:radial-gradient(700px 500px at 8% 20%,rgba(120,200,245,.5),transparent 70%),linear-gradient(115deg,#bfe4fb,#dff1fd 35%,#f4faff 65%,#fff);background-attachment:fixed}
body.bn{font-family:"Hind Siliguri","Plus Jakarta Sans",system-ui,sans-serif}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,textarea{font:inherit}
:focus-visible{outline:3px solid rgba(10,143,199,.45);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{height:68px;position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(10,100,170,.1)}
.hl,.hr{display:flex;align-items:center;gap:14px}
.burger{width:44px;height:44px;border:1px solid #d3e3f0;background:#fff;border-radius:12px;font-size:22px;color:var(--navy);cursor:pointer;display:grid;place-items:center}
.logo{display:flex;align-items:center;gap:10px}
.lm{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px;background:linear-gradient(135deg,#12b4d8,#0a7fc4)}.lm svg{stroke-width:3}
.logo b{display:block;font-size:19px;font-weight:800;color:var(--navy);line-height:1.1}.logo b span{color:#0a82c4}.logo small{font-size:12px;color:var(--muted)}
.lang{display:flex;gap:2px;padding:3px;background:#e9f1f8;border-radius:999px;border:1px solid #d3e3f0}
.lang button{border:none;background:none;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:#0a6fa8;box-shadow:0 1px 4px rgba(10,100,170,.2)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#8b5cf6,#0562a8);flex:none}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,59,94,.4);opacity:0;pointer-events:none;transition:opacity .25s}.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:86vw;z-index:55;display:flex;flex-direction:column;background:#fff;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 60px rgba(0,0,0,.25)}.drawer.open{transform:none}
.dh{padding:22px 20px;color:#fff;background:linear-gradient(135deg,#6d3fd6,#0c3b5e);display:flex;align-items:center;gap:12px}
.dh .av{width:48px;height:48px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5)}
.dh b{display:block;font-size:16px}.dh small{font-size:12.5px;opacity:.88;font-family:ui-monospace,Consolas,monospace}
.dx{margin-left:auto;border:none;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
.dn{flex:1;overflow:auto;padding:14px 12px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:4px;border:none;background:none;border-radius:12px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left}
.nav svg{font-size:20px}.nav:hover{background:#eaf4fb;color:#0a6fa8}
.nav.on{background:linear-gradient(90deg,#0a86cc,#05609f);color:#fff}
.nav.out:hover{background:#fdecee;color:var(--err)}
.cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--warn);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.df{padding:10px 12px 16px;border-top:1px solid #e3edf5}
.main{padding:26px 28px 70px;max-width:1080px;margin:0 auto;width:100%}
.sec{display:none}.sec.on{display:block}
h2{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.sub{margin:6px 0 20px;font-size:14.5px;color:var(--muted)}
.panel{background:rgba(255,255,255,.92);border:1px solid #fff;border-radius:20px;padding:20px 22px;box-shadow:0 14px 34px -18px rgba(10,100,170,.25);margin-bottom:16px}
.panel h3{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{background:rgba(255,255,255,.92);border-radius:18px;padding:18px 20px;border:1px solid #fff;box-shadow:0 12px 28px -18px rgba(10,100,170,.3)}
.stat b{display:block;font-size:28px;font-weight:800;color:var(--navy);line-height:1.1}.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--warn)}.stat.red b{color:var(--err)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:none;border-radius:11px;font-weight:700;font-size:14px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#0a86cc,#05609f)}
.btn.ok{background:linear-gradient(90deg,#12a150,#0c7a3d)}.btn.red{background:linear-gradient(90deg,#d92d3a,#b3202d)}.btn.ghost{background:#fff;color:var(--text);border:1.5px solid var(--line)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--muted);padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer}.chip.on{background:#0a86cc;border-color:#0a86cc;color:#fff}
.srch{width:100%;max-width:340px;height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:16px;outline:none;background:#fff}
.srch:focus{border-color:var(--blue)}
.dc{background:#fff;border:1px solid #e6eff6;border-radius:18px;padding:18px 20px;margin-bottom:14px;border-left:5px solid var(--c)}
.dc.pending{--c:#f59e0b}.dc.verified{--c:#12a150}.dc.rejected,.dc.suspended{--c:#d92d3a}
.dt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dt .av{background:linear-gradient(135deg,#12b4d8,#0562a8)}
.dt b{display:block;color:var(--navy);font-size:16px}.dt small{color:var(--muted);font-size:13px}
.lic{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--navy);letter-spacing:.05em}
.bd{margin-left:auto;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 20px;margin:14px 0}
.kv dt{font-size:12px;font-weight:700;color:var(--muted)}.kv dd{font-size:14px;font-weight:600;color:var(--navy);word-break:break-word}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.nt{margin-top:10px;font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #edf3f8;flex-wrap:wrap}.row:last-child{border-bottom:none}
.grow{flex:1;min-width:180px}.row .grow b{display:block;color:var(--navy);font-size:15px}.row .grow small{color:var(--muted);font-size:13px}
.date{font-size:12.5px;color:var(--muted)}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:#e6f4fc;color:#0a6fa8}
.tag.em{background:#fdecee;color:var(--err)}.tag.ok{background:#e3f7ee;color:var(--ok)}.tag.no{background:#fff4e0;color:#8a6200}
.emn{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:#fff6f7;border:1px solid #f3c6ca;color:#8e1d27;font-size:13.5px;line-height:1.45;width:100%}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.inp{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--blue)}
.ferr{color:var(--err);font-size:13.5px;min-height:20px;margin:8px 0}
.empty{text-align:center;padding:28px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:rgba(12,59,94,.45);backdrop-filter:blur(5px)}
.mcard{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:26px}
.mcard h3{color:var(--navy);margin-bottom:8px}.mcard p{font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.mcard textarea{width:100%;min-height:80px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;outline:none;margin-bottom:14px;resize:vertical}
.mrow{display:flex;gap:10px}.mrow .btn{flex:1}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
@media(max-width:820px){.fg{grid-template-columns:1fr}.main{padding:18px 16px 60px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.logo small{display:none}}
</style>
<style id="nhr-responsive-fix">
  *, *::before, *::after { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  img, svg, canvas, video { max-width: 100%; }
  h1, h2, h3, h4, p, span, label, a, td, th, li, small, strong, b { overflow-wrap: break-word; word-wrap: break-word; }
  @media (max-width: 768px) {
    .top, header, nav { height: auto !important; min-height: 60px; padding: 10px 14px !important; flex-wrap: wrap !important; gap: 8px !important; }
    .hl, .hr, .nav-right, .nav-actions, .actions, .tabs, .pills { flex-wrap: wrap !important; gap: 8px !important; }
    .wrap, .container, .shell, .page, .main, main, .card, .panel, .box, .mcard { width: 100% !important; max-width: 100% !important; }
    .card, .panel, .mcard { padding: 20px 16px !important; border-radius: 18px !important; }
    .grid, .grid2, .grid3, .grid4, .row2, .two-col, .three-col, .cols, .stats, .cards {
      grid-template-columns: 1fr !important;
      gap: 12px !important;
    }
    .idbox, .srow, .setting-row, .item-row, .list-row {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 10px !important;
    }
    .idbox button, .srow button, .setting-row button { width: 100% !important; }
    h1 { font-size: clamp(22px, 6vw, 28px) !important; line-height: 1.28 !important; }
    h2 { font-size: clamp(19px, 5vw, 24px) !important; line-height: 1.3 !important; }
    input, select, textarea { font-size: 16px !important; max-width: 100% !important; }
    button, .btn { min-height: 44px; }
    table { display: block; width: 100%; overflow-x: auto; }
  }
</style>
<script src="nhr-config.js"></script>
</head>
<body>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Menu">
  <div class="dh"><div class="av" id="dAv">A</div><div><b id="dName">Admin</b><small id="dId"></small></div><button class="dx" id="dClose" aria-label="Close">✕</button></div>
  <nav class="dn" id="nav"></nav>
  <div class="df"><button class="nav out" id="logout"></button></div>
</aside>
<header class="top">
  <div class="hl"><button class="burger" id="burger" aria-label="Menu">☰</button>
    <div class="logo"><div class="lm"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div><b>NHR <span>BD</span></b><small data-i="brandSub"></small></div></div></div>
  <div class="hr"><div class="lang" role="group" aria-label="Language"><button type="button" data-l="en">English</button><button type="button" data-l="bn">বাংলা</button></div><div class="av" id="topAv">A</div></div>
</header>

<main class="main">
  <section class="sec on" id="sec-overview">
    <h2 data-i="ovTitle"></h2><p class="sub" data-i="ovSub"></p>
    <div class="stats" id="stats"></div>
    <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0" data-i="pendTitle"></h3><button class="btn ghost" data-go="doctors" data-i="viewAll"></button></div><div id="pendList"></div></div>
  </section>

  <section class="sec" id="sec-doctors">
    <h2 data-i="dcTitle"></h2><p class="sub" data-i="dcSub"></p>
    <input class="srch" id="dq" type="search" />
    <div class="chips" id="dChips"></div>
    <div id="dList"></div>
  </section>

  <section class="sec" id="sec-facilities">
    <h2 data-i="fcTitle"></h2><p class="sub" data-i="fcSub"></p>
    <div class="panel">
      <h3 data-i="fcNew"></h3>
      <div class="fg"><div><label class="lbl" data-i="fcName"></label><input class="inp" id="fcName" maxlength="120"></div>
        <div><label class="lbl" data-i="fcType"></label><select class="inp" id="fcType"></select></div>
        <div><label class="lbl" data-i="fcLic"></label><input class="inp" id="fcLic" maxlength="40"></div>
        <div><label class="lbl" data-i="fcDist"></label><input class="inp" id="fcDist" maxlength="40"></div>
        <div><label class="lbl" data-i="fcPerson"></label><input class="inp" id="fcPerson" maxlength="60"></div>
        <div><label class="lbl" data-i="fcPhone"></label><input class="inp" id="fcPhone" inputmode="numeric" maxlength="15"></div></div>
      <label class="lbl" data-i="fcAddr"></label><input class="inp" id="fcAddr" maxlength="160">
      <div class="ferr" id="fcErr"></div>
      <button class="btn" id="fcCreate" data-i="fcCreate"></button>
    </div>
    <div id="fList"></div>
  </section>

  <section class="sec" id="sec-audit">
    <h2 data-i="auTitle"></h2><p class="sub" data-i="auSub"></p>
    <div class="chips" id="aChips"></div>
    <div class="panel" id="aList"></div>
  </section>

  <section class="sec" id="sec-patients">
    <h2 data-i="ptTitle"></h2><p class="sub" data-i="ptSub"></p>
    <input class="srch" id="pq" type="search" />
    <div class="panel" id="pList"></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="mcard" role="dialog" aria-modal="true">
    <h3 id="mTitle"></h3><p id="mDesc"></p>
    <textarea id="mNote" maxlength="200"></textarea>
    <div class="mrow"><button class="btn ghost" id="mNo"></button><button class="btn red" id="mGo"></button></div>
  </div>
</div>
<div class="modal" id="credModal" hidden>
  <div class="mcard" role="dialog" aria-modal="true">
    <h3 data-i="credTitle"></h3><p data-i="credDesc"></p>
    <dl class="kv" style="grid-template-columns:1fr"><div><dt data-i="credId"></dt><dd class="lic" id="credId" style="font-size:20px"></dd></div><div><dt data-i="credPw"></dt><dd class="lic" id="credPw" style="font-size:20px"></dd></div></dl>
    <div class="mrow" style="margin-top:16px"><button class="btn ghost" id="credCopy"></button><button class="btn" id="credDone"></button></div>
  </div>
</div>
<div id="toast" hidden></div>

/* ===== Firebase Base Integration ===== */
async function api(url, body, method) {
  try {
    // ১. ওভারভিউ ড্যাশবোর্ড স্ট্যাটস
    if (url.includes("/api/admin/stats")) {
      const usersSnap = await db.collection("users").get();
      const recordsSnap = await db.collection("records").get();
      const facsSnap = await db.collection("facilities").get();

      let patients = 0, verified = 0, pending = 0, blocked = 0;
      usersSnap.forEach(doc => {
        const u = doc.data();
        if (u.role === "doctor") {
          if (u.status === "verified") verified++;
          else if (u.status === "pending") pending++;
          else if (u.status === "rejected" || u.status === "suspended") blocked++;
        } else {
          patients++;
        }
      });

      return {
        ok: true, status: 200,
        data: {
          stats: {
            patients, verified, pending, blocked,
            accessToday: 1, emergencyToday: 0, emergencyTotal: 0,
            facilities: facsSnap.size, labReports: recordsSnap.size, records: recordsSnap.size
          }
        }
      };
    }

    // ২. ডাক্তারদের লিস্ট লোড
    if (url.includes("/api/admin/doctors") && !url.includes("verify")) {
      
if (url.includes("/api/admin/doctors") && !url.includes("verify")) {

  const snap = await db.collection("users")
    .where("role", "==", "doctor")
    .get();

  const doctorsList = snap.docs.map(doc => {

    const d = doc.data();

    return {
      id: doc.id,

      name: d.fullName || "Dr. User",

      license:
        d.doctor?.doctorId ||
        d.doctor?.license ||
        d.bmdc ||
        d.license ||
        "DOC0000",

      nid: d.nid || "N/A",

      phone: d.phone || "N/A",

      speciality:
        d.doctor?.speciality ||
        d.specialty ||
        "Medicine",

      hospital:
        d.doctor?.hospital ||
        d.hospital ||
        "Chamber",

      status: d.status || "pending",

      registeredAt: d.createdAt
        ? (d.createdAt.toDate
            ? d.createdAt.toDate()
            : d.createdAt)
        : new Date(),

      reviewedAt: d.reviewedAt || null,

      reviewNote: d.reviewNote || ""

    };

  });

  return {
    ok: true,
    status: 200,
    data: { doctors: doctorsList }
  };
}

      return { ok: true, status: 200, data: { doctors: doctorsList } };
    }

    // ৩. ডাক্তার লাইসেন্স অনুমোদন (Approve/Reject/Suspend) - Fixed
   
if (url.includes("/api/admin/doctors/verify")) {

  const { license, action, note } = body;

  if (!license || !action) {
    return {
      ok: false,
      status: 400,
      data: { error: "Missing doctor ID or action" }
    };
  }

  // Doctor ID দিয়ে Firestore-এ Doctor খুঁজবে
  let snap = await db.collection("users")
    .where("doctor.doctorId", "==", license)
    .limit(1)
    .get();

  // প্রথম search-এ না পেলে nested license দিয়ে খুঁজবে
  if (snap.empty) {

    snap = await db.collection("users")
      .where("doctor.license", "==", license)
      .limit(1)
      .get();

  }

  // পুরোনো data থাকলে top-level field-ও check করবে
  if (snap.empty) {

    snap = await db.collection("users")
      .where("bmdc", "==", license)
      .limit(1)
      .get();

  }

  if (snap.empty) {

    snap = await db.collection("users")
      .where("license", "==", license)
      .limit(1)
      .get();

  }

  if (snap.empty) {

    return {
      ok: false,
      status: 404,
      data: { error: "Doctor document not found" }
    };

  }

  const targetDoc = snap.docs[0];

  let newStatus;

  if (action === "verify") {
    newStatus = "verified";
  }
  else if (action === "reject") {
    newStatus = "rejected";
  }
  else if (action === "suspend") {
    newStatus = "suspended";
  }
  else {
    return {
      ok: false,
      status: 400,
      data: { error: "Invalid action" }
    };
  }

  // Update both top-level and nested verification status
  await db.collection("users")
    .doc(targetDoc.id)
    .update({

      status: newStatus,

      "doctor.verificationStatus": newStatus,

      reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),

      reviewNote: note || "",

      updatedAt: firebase.firestore.FieldValue.serverTimestamp()

    });

  console.log("Doctor status updated:", license, newStatus);

  return {
    ok: true,
    status: 200,
    data: {
      message: "Doctor status updated successfully"
    }
  };
}


    // ৪. হাসপাতাল ও ডায়াগনস্টিক ল্যাব তৈরি
    // ৪. সিকুয়েন্স আইডিসহ (L00000001...) হাসপাতাল ও ডায়াগনস্টিক ল্যাব তৈরি
    if (url.includes("/api/admin/facilities")) {
      if (method === "POST" || body) {
        // Transaction ব্যবহার করে ৮ ডিজিটের সিকুয়েন্স আইডি তৈরি (L00000001, L00000002...)
        const counterRef = db.collection("counters").doc("facilities");
        
        const facilityId = await db.runTransaction(async (transaction) => {
          const counterDoc = await transaction.get(counterRef);
          let nextNumber = 1;
          if (counterDoc.exists) {
            nextNumber = (counterDoc.data().current || 0) + 1;
          }
          const paddedNumber = String(nextNumber).padStart(8, '0');
          const autoId = `L${paddedNumber}`;
          transaction.set(counterRef, { current: nextNumber }, { merge: true });
          return autoId;
        });

        // পাসওয়ার্ড এবং ফায়ারবেস Auth ইমেইল তৈরি
        const tmpPw = "NHR" + Math.floor(100000 + Math.random() * 900000);
        const authEmail = `${facilityId.toLowerCase()}@nhr.bd`;

        // Firebase Auth-এ রেজিস্টার
        let uid = facilityId;
        try {
          const userCred = await auth.createUserWithEmailAndPassword(authEmail, tmpPw);
          uid = userCred.user.uid;
        } catch (authErr) {
          console.warn("Auth user creation warning:", authErr.message);
        }

        const facilityData = {
          ...body,
          id: facilityId,
          facilityId: facilityId,
          email: authEmail,
          uid: uid,
          role: "facility",
          tempPw: true,
          status: "active",
          reports: 0,
          createdAt: new Date().toISOString()
        };

        // Firestore-এর facilities ও users দুই জায়গাতেই সেভ
        await db.collection("facilities").doc(facilityId).set(facilityData);
        await db.collection("users").doc(uid).set(facilityData);

        return { ok: true, status: 200, data: { id: facilityId, password: tmpPw } };
      }

      // লিস্ট লোড করার সময়
      const snap = await db.collection("facilities").get();
      const facsList = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      return { ok: true, status: 200, data: { facilities: facsList } };
    }

    // ৫. হাসপাতাল স্থগিত/চালু করা
    if (url.includes("/api/admin/facilities/status")) {
      const { id, action } = body;
      const newStatus = action === "suspend" ? "suspended" : "active";
      await db.collection("facilities").doc(id).update({ status: newStatus });
      let tmpPw = null;
      if (action === "reset") tmpPw = "NHR" + Math.floor(100000 + Math.random() * 900000);
      return { ok: true, status: 200, data: { password: tmpPw } };
    }

    // ৬. অ্যাক্সেস লগ ও পেসেন্ট লিস্ট
    if (url.includes("/api/admin/audit")) {
      const snap = await db.collection("access_logs").orderBy("when", "desc").get();
      const logs = snap.docs.map(d => ({ doctorName: d.data().name || "Doctor", license: "DOC0001", patient: "Patient", patientId: d.data().nhrId, method: d.data().method || "otp", when: d.data().when }));
      return { ok: true, status: 200, data: { log: logs } };
    }
    if (url.includes("/api/admin/patients")) {
      const snap = await db.collection("users").where("role", "==", "patient").get();
      const ptsList = snap.docs.map(d => {
        const p = d.data();
        return {
          nhrId: p.nhrId || p.nid,
          maskedName: p.fullName || "Patient",
          district: p.district || "Dhaka",
          registeredAt: p.createdAt ? (p.createdAt.toDate ? p.createdAt.toDate() : p.createdAt) : new Date(),
          fingerprint: false,
          alsoDoctor: false,
          status: "active"
        };
      });
      return { ok: true, status: 200, data: { patients: ptsList } };
    }

  } catch(e) {
    console.error("Admin API Error:", e);
    return { ok: false, status: 500, data: { error: "serverErr" } };
  }
  return { ok: true, status: 200, data: {} };
}

    :'<button class="btn ok" data-act="verify" data-lic="'+esc(d.license)+'">'+t("reinstate")+"</button>";
  return '<div class="dc '+d.status+'"><div class="dt"><div class="av">'+esc((d.name||"?")[0])+'</div><div><b>'+esc(d.name)+'</b><small class="lic">'+esc(d.license)+'</small></div><span class="bd">'+t(stK)+"</span></div>"+
    '<dl class="kv"><div><dt>'+t("kNid")+"</dt><dd>"+esc(d.nid)+"</dd></div><div><dt>"+t("kPhone")+"</dt><dd>"+esc(d.phone)+"</dd></div><div><dt>"+esc(d.speciality)+"</dt><dd>"+esc(d.hospital)+"</dd></div><div><dt>"+t("kReg")+"</dt><dd>"+fmtD(d.registeredAt)+"</dd></div>"+(d.reviewedAt?"<div><dt>"+t("kRev")+"</dt><dd>"+fmtD(d.reviewedAt)+"</dd></div>":"")+"</dl>"+
    '<div class="acts">'+btns+"</div>"+(d.reviewNote?'<p class="nt">“'+esc(d.reviewNote)+"”</p>":"")+"</div>";
}

function render(){
  document.documentElement.lang=lang;document.body.classList.toggle("bn",lang==="bn");document.title=t("brandSub")+" | NHR BD";
  document.querySelectorAll("[data-i]").forEach((el)=>{el.textContent=t(el.dataset.i)});
  document.querySelectorAll(".lang button").forEach((b)=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("dq").placeholder=t("dSearch");$("pq").placeholder=t("pSearch");$("mNote").placeholder=t("mNote");$("mNo").textContent=t("mCancel");
  $("logout").innerHTML=ic("M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9")+"<span>"+t("logout")+"</span>";
  $("dName").textContent=ses.name||"Admin";$("dId").textContent=ses.nhrId||"";$("dAv").textContent=$("topAv").textContent=((ses.name||"A")[0]||"A").toUpperCase();
  const pend=ST?ST.pending:0;
  $("nav").innerHTML=NAV.map((n)=>'<button class="nav'+(n[0]===section?" on":"")+'" data-go="'+n[0]+'">'+ic(n[2])+"<span>"+t(n[1])+"</span>"+(n[0]==="doctors"&&pend?'<i class="cnt">'+pend+"</i>":"")+"</button>").join("");
  if(ST){const c=(v,k,x)=>'<div class="stat '+(x||"")+'"><b>'+v+"</b><span>"+t(k)+"</span></div>";
    $("stats").innerHTML=c(ST.patients,"sPat")+c(ST.verified,"sDoc")+c(ST.pending,"sPend",ST.pending?"warn":"")+c(ST.accessToday,"sAcc")+c(ST.emergencyToday,"sEm",ST.emergencyToday?"red":"")+c(ST.emergencyTotal,"sEmAll")+c(ST.facilities,"sFac")+c(ST.labReports,"sLab")+c(ST.records,"sRec")+c(ST.blocked,"sBlk")}
  const pl=DOCS.filter((d)=>d.status==="pending");
  $("pendList").innerHTML=pl.length?pl.slice(0,3).map(docCard).join(""):'<p class="empty">'+t("noPend")+"</p>";
  $("dChips").innerHTML=[["pending","fPend"],["verified","fVer"],["blocked","fBlk"],["all","fAll"]].map((c)=>'<button class="chip'+(dFilter===c[0]?" on":"")+'" data-df="'+c[0]+'">'+t(c[1])+"</button>").join("");
  const ql=dq.trim().toLowerCase();
  const dl=DOCS.filter((d)=>(dFilter==="all"||(dFilter==="blocked"?["rejected","suspended"].includes(d.status):d.status===dFilter))&&(!ql||(d.name+" "+d.license+" "+d.hospital+" "+d.speciality).toLowerCase().includes(ql)));
  $("dList").innerHTML=dl.length?dl.map(docCard).join(""):'<p class="empty">'+t("noDocs")+"</p>";
  $("aChips").innerHTML=[["all","aAll"],["em","aEm"]].map((c)=>'<button class="chip'+(aFilter===c[0]?" on":"")+'" data-af="'+c[0]+'">'+t(c[1])+"</button>").join("");
  const mk={fp:"mFp",otp:"mOtp",em:"mEm"};
  $("aList").innerHTML=AUD.length?AUD.map((a)=>'<div class="row"><div class="grow"><b>'+esc(a.doctorName)+' <span class="lic" style="font-size:12px">'+esc(a.license)+"</span></b><small>→ "+esc(a.patient)+" · "+groups(esc(a.patientId))+'</small></div><span class="tag '+(a.method==="em"?"em":"")+'">'+t(mk[a.method]||"mOtp")+'</span><span class="date">'+fmt(a.when)+"</span>"+(a.method==="em"?'<div class="emn"><b>'+esc((t("rsn")||{})[a.reason]||a.reason)+"</b>"+(a.note?": "+esc(a.note):"")+"</div>":"")+"</div>").join(""):'<p class="empty">'+t("noAudit")+"</p>";
  const cur=$("fcType").value||"hospital";
  $("fcType").innerHTML=[["hospital","tHospital"],["clinic","tClinic"],["lab","tLab"]].map((x)=>'<option value="'+x[0]+'">'+t(x[1])+"</option>").join("");$("fcType").value=cur;
  const tyK={hospital:"tHospital",clinic:"tClinic",lab:"tLab"};
  $("fList").innerHTML=FACS.length?FACS.map((f)=>'<div class="dc '+(f.status==="active"?"verified":"suspended")+'"><div class="dt"><div class="av">'+esc((f.name||"?")[0])+'</div><div><b>'+esc(f.name)+'</b><small class="lic">'+esc(f.id)+'</small></div><span class="bd">'+t(f.status==="active"?"stActive":"stSuspF")+"</span></div>"+
    '<dl class="kv"><div><dt>'+t(tyK[f.type])+"</dt><dd>"+esc(f.license)+"</dd></div><div><dt>"+t("fcDist")+"</dt><dd>"+esc(f.district)+"</dd></div><div><dt>"+t("fcPerson")+"</dt><dd>"+esc(f.contactPerson)+" · "+esc(f.phone)+"</dd></div><div><dt>"+t("fcAddr")+"</dt><dd>"+esc(f.address)+"</dd></div><div><dt>"+(f.reports||0)+" "+t("fcReports")+"</dt><dd>"+fmtD(f.createdAt)+"</dd></div></dl>"+
    '<div class="acts">'+(f.status==="active"?'<button class="btn red" data-fa="suspend" data-fid="'+esc(f.id)+'">'+t("fcSuspend")+"</button>":'<button class="btn ok" data-fa="activate" data-fid="'+esc(f.id)+'">'+t("fcActivate")+"</button>")+'<button class="btn ghost" data-fa="reset" data-fid="'+esc(f.id)+'">'+t("fcReset")+"</button></div></div>").join(""):'<p class="empty">'+t("noFacs")+"</p>";
  $("credCopy").textContent=t("copy");$("credDone").textContent=t("done");
  const pq2=pq.trim().toLowerCase();
  const pl2=PTS.filter((p)=>!pq2||(p.nhrId+" "+p.district).toLowerCase().includes(pq2));
  $("pList").innerHTML=pl2.length?pl2.map((p)=>'<div class="row"><div class="grow"><b>'+esc(p.maskedName)+"</b><small>"+groups(esc(p.nhrId))+" · "+esc(p.district)+" · "+fmtD(p.registeredAt)+"</small></div>"+(p.fingerprint?'<span class="tag ok">'+t("tFp")+"</span>":"")+(p.alsoDoctor?'<span class="tag">'+t("tDoc")+"</span>":"")+(p.status==="deactivated"?'<span class="tag no">'+t("pDeact")+"</span>":p.status==="pending_delete"?'<span class="tag em">'+t("pDel")+"</span>":"")+"</div>").join(""):'<p class="empty">'+t("noPt")+"</p>";
}

async function loadMain(){
  const [s,d,fc]=await Promise.all([api("/api/admin/stats"),api("/api/admin/doctors"),api("/api/admin/facilities")]);
  if(s.ok)ST=s.data.stats;if(d.ok)DOCS=d.data.doctors;if(fc.ok)FACS=fc.data.facilities;render();
}
async function loadAudit(){const r=await api("/api/admin/audit"+(aFilter==="em"?"?type=em":""));if(r.ok)AUD=r.data.log;render()}
async function loadPatients(){const r=await api("/api/admin/patients");if(r.ok)PTS=r.data.patients;render()}

/* review actions */
let pending=null;
function closeModal(){$("modal").hidden=true;pending=null}
$("mNo").onclick=closeModal;
$("mGo").onclick=async()=>{if(pending){const p=pending;closeModal();await review(p.lic,p.act,$("mNote").value)}};
async function review(lic,act,note){
  const r=await api("/api/admin/doctors/verify",{license:lic,action:act,note:note||""});
  if(!r.ok)return toast(t("serverErr"));
  toast(t({verify:"doneVer",reject:"doneRej",suspend:"doneSus"}[act]));loadMain();
}
function showCred(id,pw){$("credId").textContent=id;$("credPw").textContent=pw;$("credModal").hidden=false}
$("credDone").onclick=()=>{$("credModal").hidden=true;$("credPw").textContent=""};
$("credCopy").onclick=async()=>{const x="ID: "+$("credId").textContent+"\nPassword: "+$("credPw").textContent;try{await navigator.clipboard.writeText(x)}catch(e){}$("credCopy").textContent=t("copied");setTimeout(()=>{$("credCopy").textContent=t("copy")},1500)};
$("fcPhone").addEventListener("input",(e)=>{e.target.value=e.target.value.replace(/\D/g,"")});
$("fcCreate").onclick=async()=>{
  $("fcErr").textContent="";
  const b={name:$("fcName").value.trim(),type:$("fcType").value,license:$("fcLic").value.trim(),district:$("fcDist").value.trim(),contactPerson:$("fcPerson").value.trim(),phone:$("fcPhone").value.trim(),address:$("fcAddr").value.trim()};
  if(b.name.length<3||b.license.length<3||b.district.length<2||b.contactPerson.length<3||b.address.length<5||!/^\d{7,15}$/.test(b.phone)){$("fcErr").textContent=t("fcErr");return}
  $("fcCreate").disabled=true;const r=await api("/api/admin/facilities",b);$("fcCreate").disabled=false;
  if(!r.ok){$("fcErr").textContent=t(r.data&&r.data.error==="dupLic"?"fcDup":"serverErr");return}
  ["fcName","fcLic","fcDist","fcPerson","fcPhone","fcAddr"].forEach((i)=>{$(i).value=""});
  showCred(r.data.id,r.data.password);loadMain();
};
document.addEventListener("click",(e)=>{
  const fa=e.target.closest("[data-fa]");if(fa){(async()=>{const r=await api("/api/admin/facilities/status",{id:fa.dataset.fid,action:fa.dataset.fa});if(!r.ok)return toast(t("serverErr"));
    if(r.data.password)showCred(fa.dataset.fid,r.data.password);else toast(t(fa.dataset.fa==="suspend"?"doneSusF":"doneActF"));loadMain()})();return}
  const go=e.target.closest("[data-go]");if(go)return show(go.dataset.go);
  const df=e.target.closest("[data-df]");if(df){dFilter=df.dataset.df;return render()}
  const af=e.target.closest("[data-af]");if(af){aFilter=af.dataset.af;return loadAudit()}
  const a=e.target.closest("[data-act]");if(!a)return;
  const lic=a.dataset.lic,act=a.dataset.act;
  if(act==="verify")return review(lic,"verify");
  $("mTitle").textContent=t(act==="reject"?"mRejT":"mSusT");$("mDesc").textContent=t(act==="reject"?"mRejD":"mSusD");
  $("mGo").textContent=t(act);$("mNote").value="";pending={lic,act};$("modal").hidden=false;$("mNote").focus();
});
$("dq").addEventListener("input",(e)=>{dq=e.target.value;render()});
$("pq").addEventListener("input",(e)=>{pq=e.target.value;render()});
document.querySelectorAll(".lang button").forEach((b)=>b.addEventListener("click",()=>{lang=b.dataset.l;localStorage.setItem("nhr_lang",lang);render()}));
$("logout").onclick=async()=>{clearSession();location.href="login.html"};
render();loadMain();
</script>
</body>
</html>
