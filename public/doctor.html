<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doctor Portal | NHR BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- Firebase SDKs Integration -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<style>
:root{--navy:#0c3b5e;--blue:#0a8fc7;--line:#d9e5f0;--text:#1b2d42;--muted:#5b6b80;--err:#d92d3a;--ok:#12a150;--warn:#d97706;--font:"Plus Jakarta Sans","Hind Siliguri","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;background:radial-gradient(700px 500px at 8% 20%,rgba(120,200,245,.5),transparent 70%),linear-gradient(115deg,#bfe4fb,#dff1fd 35%,#f4faff 65%,#fff);background-attachment:fixed}
body.bn{font-family:"Hind Siliguri","Plus Jakarta Sans",system-ui,sans-serif}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid rgba(10,143,199,.45);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.top{height:68px;position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(10,100,170,.1)}
.hl,.hr{display:flex;align-items:center;gap:12px}
.burger{width:44px;height:44px;border:1px solid #d3e3f0;background:#fff;border-radius:12px;font-size:22px;color:var(--navy);cursor:pointer;display:grid;place-items:center}
.logo{display:flex;align-items:center;gap:10px}
.lm{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px;background:linear-gradient(135deg,#12b4d8,#0a7fc4)}.lm svg{stroke-width:3}
.logo b{display:block;font-size:19px;font-weight:800;color:var(--navy);line-height:1.1}.logo b span{color:#0a82c4}.logo small{font-size:12px;color:var(--muted)}
.lang{display:flex;gap:2px;padding:3px;background:#e9f1f8;border-radius:999px;border:1px solid #d3e3f0}
.lang button{border:none;background:none;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:#0a6fa8;box-shadow:0 1px 4px rgba(10,100,170,.2)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#12b4d8,#0562a8);flex:none;cursor:pointer;border:none}
.bell{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid #d3e3f0;background:#fff;color:var(--navy);cursor:pointer;display:grid;place-items:center;font-size:19px}
.bell .bd{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;background:var(--err);color:#fff;font-size:11px;font-weight:800;border-radius:999px;border:2px solid #fff;display:grid;place-items:center}
.pop{position:fixed;top:64px;right:18px;width:min(340px,92vw);background:#fff;border-radius:18px;box-shadow:0 14px 40px rgba(10,59,94,.2);border:1px solid #e3edf5;z-index:60;padding:14px;display:none;max-height:70vh;overflow:auto}
.pop.open{display:block}
.pop-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #edf3f8}
.pop-h b{font-size:14px;color:var(--navy)}
.ni{padding:10px 12px;border-radius:10px;background:#f8fbfe;margin-bottom:8px;font-size:13.5px;border-left:4px solid var(--line)}
.ni.un{background:#edf7ff;border-left-color:var(--blue);font-weight:700}
.ni small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px;font-weight:400}

/* drawer */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,59,94,.4);opacity:0;pointer-events:none;transition:opacity .25s}.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:86vw;z-index:55;display:flex;flex-direction:column;background:#fff;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 60px rgba(0,0,0,.25)}.drawer.open{transform:none}
.dh{padding:22px 20px;color:#fff;background:linear-gradient(135deg,#0a86cc,#0c3b5e);display:flex;align-items:center;gap:12px}
.dh .av{width:48px;height:48px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5)}
.dh b{display:block;font-size:16px}.dh small{font-size:12.5px;opacity:.88}
.dx{margin-left:auto;border:none;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
.dn{flex:1;overflow:auto;padding:14px 12px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:4px;border:none;background:none;border-radius:12px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left}
.nav svg{font-size:20px}.nav:hover{background:#eaf4fb;color:#0a6fa8}
.nav.on{background:linear-gradient(90deg,#0a86cc,#05609f);color:#fff}
.nav.out:hover{background:#fdecee;color:var(--err)}
.dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.df{padding:10px 12px 16px;border-top:1px solid #e3edf5}

/* layout + common */
.main{padding:26px 28px 70px;max-width:1080px;margin:0 auto;width:100%}
.sec{display:none}.sec.on{display:block}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.sub{margin:6px 0 20px;font-size:14.5px;color:var(--muted);line-height:1.5}
.panel{background:rgba(255,255,255,.92);border:1px solid #fff;border-radius:20px;padding:22px 24px;box-shadow:0 14px 34px -18px rgba(10,100,170,.25);margin-bottom:20px}
.panel h3{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border:none;border-radius:12px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,#0a86cc,#05609f)}
.btn.red{background:linear-gradient(90deg,#d92d3a,#b3202d)}.btn.ghost{background:#fff;color:var(--text);border:1.5px solid var(--line)}.btn.sm{padding:8px 16px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.inp{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(10,143,199,.15)}
.inp[readonly]{background:#f3f7fb;color:var(--muted)}
textarea.inp{height:auto;padding:12px 14px;min-height:92px;resize:vertical}
.srow{display:flex;gap:10px;flex-wrap:wrap}.srow .inp{flex:1;min-width:200px;font-family:ui-monospace,Consolas,monospace;font-size:18px;letter-spacing:.08em}
.err{color:var(--err);font-size:13.5px;min-height:20px;margin-top:8px}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.demo{margin-bottom:18px;padding:10px 14px;border-radius:12px;font-size:13px;color:#6a5200;background:#fff8e1;border:1px solid #f3dd9b}
.demo.bad{color:#8e1d27;background:#fff1f2;border-color:#f3c6ca;font-weight:700}
.sample{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:#fff4e0;color:#8a6200;font-size:11.5px;font-weight:800;vertical-align:middle}
.state{font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px;background:#e3f7ee;color:var(--ok)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

/* overview */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat{background:#fff;padding:18px;border-radius:18px;border:1px solid #e3edf5;box-shadow:0 10px 24px -18px rgba(10,100,170,.25)}
.stat h4{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
.stat b{font-size:26px;color:var(--navy);font-weight:800;display:block}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.qb{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border:1.5px solid #e3edf5;border-radius:16px;color:var(--navy);font-weight:700;cursor:pointer;text-align:left;box-shadow:0 8px 20px -14px rgba(10,100,170,.3)}
.qb:hover{border-color:var(--blue)}.qb svg{font-size:26px;color:var(--blue)}.qb small{display:block;color:var(--muted);font-weight:400;font-size:13px}

/* search + verify PATIENT CARD */
.patient-card-modern{display:flex;flex-direction:column;gap:16px;background:#fff;border:1px solid #e2edf7;border-radius:18px;padding:18px;box-shadow:0 4px 15px rgba(12,59,94,.05)}
.pcm-head{display:flex;align-items:center;gap:14px;width:100%;flex-wrap:wrap}
.pcm-av{width:56px;height:56px;border-radius:50%;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(135deg,#0a86cc,#0c3b5e);display:grid;place-items:center;flex:none}
.pcm-info{flex:1;min-width:180px}
.pcm-info b{font-size:19px;color:var(--navy);display:block;line-height:1.2}
.pcm-info small{color:var(--muted);font-size:13px;font-weight:500;display:block;margin-top:2px}
.pcm-lock{font-size:12px;font-weight:800;padding:6px 14px;border-radius:999px;background:#fff4e0;color:#8a6200;display:inline-flex;align-items:center;gap:6px;border:1px solid #ffe7b8}
.pcm-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding-top:14px;border-top:1px dashed #e3edf5}
.pcm-box{background:#f6fafd;padding:10px 14px;border-radius:12px;border:1px solid #e3edf5}
.pcm-box small{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;display:block;margin-bottom:2px}
.pcm-box b{font-size:14px;color:var(--navy);font-weight:700;display:flex;align-items:center;gap:6px}
.blood-badge{background:#ffebee;color:#d92d3a;padding:2px 8px;border-radius:6px;font-size:13px;font-weight:800;border:1px solid #ffcdd2}

.doc-msg-banner{background:#eef7ff;border:1.5px solid #0a86cc;border-radius:14px;padding:14px 16px;margin-bottom:14px;color:#0c3b5e;font-size:14px;line-height:1.5}
.doc-msg-banner b{color:#0a86cc}

.openbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:16px;background:#e3f7ee;border:1px solid #bfe8d2;margin-bottom:18px}
.openbar b{color:#0c7a3d}.openbar .timer{margin-left:auto}
.vm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:6px 0 18px}
.vm button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border:1.5px solid var(--line);background:#fff;border-radius:16px;cursor:pointer;color:var(--navy);font-weight:800}
.vm button svg{font-size:24px;color:var(--blue)}.vm button small{font-weight:500;color:var(--muted);font-size:12.5px;line-height:1.4}
.vm button.on{border-color:#0a86cc;box-shadow:0 0 0 3px rgba(10,134,204,.15);background:#f4fbff}
.vm button.em svg{color:var(--err)}.vm button.em.on{border-color:var(--err);box-shadow:0 0 0 3px rgba(217,45,58,.15);background:#fff6f7}
.vbody{padding:18px;border-radius:16px;background:#f6fafd;border:1px solid #e3edf5}
.vbody p{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.qrbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:16px}.qrbox .q{background:#fff;padding:8px;border-radius:12px}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--blue);margin-right:8px;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.25}}
.otp{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:700;font-family:ui-monospace,Consolas,monospace}
.warn{padding:12px 14px;border-radius:12px;background:#fff1f2;border:1px solid #f3c6ca;color:#8e1d27;font-size:13.5px;line-height:1.5;margin-bottom:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin:12px 0;line-height:1.45}.chk input{margin-top:3px;width:17px;height:17px}

/* patient view */
.phead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.phead .av{width:60px;height:60px;font-size:22px;background:linear-gradient(135deg,#8b5cf6,#0562a8);cursor:default}
.phead h2{margin:0}.phead small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.phead .rt{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:15px;padding:7px 12px;border-radius:10px;background:#e6f4fc;color:#0a6fa8}.timer.low{background:#fdecee;color:var(--err)}
.scope{font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px}.scope.full{background:#e3f7ee;color:var(--ok)}.scope.emg{background:#fdecee;color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--muted);padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer}.chip.on{background:#0a86cc;border-color:#0a86cc;color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.al{background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #e6eff6;border-left:5px solid var(--c)}
.al b{display:block;color:var(--navy);margin-bottom:4px}.al span{font-size:12.5px;font-weight:800;color:var(--c)}.al small{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.al.high{--c:#d92d3a}.al.mid{--c:#f59e0b}.al.low{--c:#12a150}
.alert{padding:14px 16px;border-radius:14px;background:#fff1f2;border:1px solid #f3c6ca;color:#8e1d27;font-weight:700;margin-bottom:16px}
.alert.ok{background:#fff8e1;border-color:#f3dd9b;color:#6a5200}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #edf3f8;flex-wrap:wrap}.row:last-child{border-bottom:none}
.grow{flex:1;min-width:160px}.row .grow b{display:block;color:var(--navy);font-size:15px}.row .grow small{color:var(--muted);font-size:13px}
.date{font-size:12.5px;color:var(--muted)}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:#e6f4fc;color:#0a6fa8}.tag.em{background:#fdecee;color:var(--err)}
.tl{position:relative;padding-left:30px}.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:#d3e5f2}
.ti{position:relative;margin-bottom:14px;background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #e6eff6}
.ti::before{content:"";position:absolute;left:-27px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 2px var(--c)}
.ti.rx{--c:#0a86cc}.ti.lab{--c:#8b5cf6}.ti.vac{--c:#12a150}.ti.visit{--c:#f59e0b}
.tt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.badge{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white)}
.ti b{display:block;color:var(--navy);font-size:15.5px}.by{font-size:13px;color:var(--muted);margin:2px 0 6px}.ti p{font-size:14px;color:#33465e;line-height:1.5}
.empty{text-align:center;padding:28px;color:var(--muted)}

/* prescription form */
.mr{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 38px;gap:8px;margin-bottom:8px;align-items:center}
.mr .inp{height:42px;font-size:14px;padding:0 10px}
.mh{font-size:12px;font-weight:700;color:var(--muted)}
.x{width:38px;height:38px;border:none;border-radius:10px;background:#fdecee;color:var(--err);cursor:pointer;font-size:15px}
.add{margin-top:4px;border:1.5px dashed #9db3cb;background:none;color:#0a6fa8;font-weight:700;border-radius:12px;padding:10px 16px;cursor:pointer}
.alw{padding:14px 16px;border-radius:14px;background:#fff1f2;border:2px solid #e5484d;color:#8e1d27;margin:14px 0}
.alw b{display:block;margin-bottom:6px}.alw li{margin-left:18px;font-size:14px;line-height:1.5}.alw small{display:block;margin-top:8px;color:#a6414a}

/* settings */
.pwrap{position:relative;max-width:420px}.pwrap .inp{padding-right:78px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:6px}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #edf3f8;flex-wrap:wrap}.setrow:last-child{border-bottom:none}
.setrow .grow b{display:block;color:var(--navy);font-size:15px}.setrow .grow small{color:var(--muted);font-size:13px;line-height:1.4}
.setrow select{height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.zone{border-color:#f3c6ca}.zone h3{color:var(--err)}

/* modals */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(12,59,94,.45);backdrop-filter:blur(5px)}
.mcard{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:24px}
.mcard h3{color:var(--navy);margin-bottom:6px;font-size:19px}.mcard>p{font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.mcard .inp{margin-bottom:8px}.mrow{display:flex;gap:10px;margin-top:14px}.mrow .btn{flex:1}
.opts{display:grid;gap:6px;margin:6px 0 10px}
.opts label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px}
.opts label:has(input:checked){border-color:var(--blue);background:#f4fbff}
.opts input{width:17px;height:17px;accent-color:#0a86cc}
.dinfo{padding:12px 14px;border-radius:12px;background:#f6fafd;border:1px solid #e3edf5;font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:8px}
.dinfo li{margin-left:18px}
.vid{width:100%;border-radius:16px;background:#0c3b5e;aspect-ratio:4/3;object-fit:cover}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);max-width:92vw;text-align:center}

@media(max-width:820px){.main{padding:18px 16px 60px}.stats{grid-template-columns:repeat(2,1fr)}.vm,.g2,.pcm-details{grid-template-columns:1fr}.logo small{display:none}.phead .rt{margin-left:0}h1{font-size:23px}
 .mr{grid-template-columns:1fr 1fr;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.mr .nm{grid-column:1/3}.mh{display:none}.x{width:100%}}
</style>
<style id="nhr-responsive-fix">
  *, *::before, *::after { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  img, svg, canvas, video { max-width: 100%; }
  h1, h2, h3, h4, p, span, label, a, td, th, li, small, strong, b { overflow-wrap: break-word; word-wrap: break-word; }
  @media (max-width: 768px) {

<body>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Menu">
  <div class="dh"><div class="av" id="dAv">?</div><div><b id="dName">...</b><small id="dSub"></small></div><button class="dx" id="dClose" aria-label="Close">✕</button></div>
  <nav class="dn" id="nav"></nav>
  <div class="df"><button class="nav out" id="logout"></button></div>
</aside>

<header class="top">
  <div class="hl"><button class="burger" id="burger" aria-label="Menu">☰</button>
    <div class="logo"><div class="lm"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div><b>NHR <span>BD</span></b><small data-i="brandSub"></small></div></div></div>
  <div class="hr">
    <button class="bell" id="bell" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg><span class="bd" id="bellBd" hidden>0</span></button>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-l="en">English</button><button type="button" data-l="bn">বাংলা</button></div>
    <button type="button" class="av" id="topAv" data-go="profile" title="Profile" aria-label="Profile">?</button>
  </div>
</header>

<div class="pop" id="pop">
  <div class="pop-h"><b data-i="notifTitle"></b><button class="btn ghost sm" id="markRead" data-i="markRead"></button></div>
  <div id="notifList"></div>
</div>

<main class="main">
  <div class="demo" id="demoBar" hidden></div>
  <div class="demo bad" id="errBar" hidden role="alert"></div>

  <!-- Overview -->
  <section class="sec on" id="sec-overview">
    <h1><span data-i="ovTitle"></span> <span id="ovName"></span></h1><p class="sub" data-i="ovSub"></p>
    <div class="stats" id="stats"></div>
    <div class="qa" id="qa"></div>
    <div class="panel"><h3 data-i="recent"></h3><div id="ovRecent"></div></div>
  </section>

  <!-- Find patient -->
  <section class="sec" id="sec-search">
    <div id="openBar" class="openbar" hidden></div>
    <h1 data-i="seTitle"></h1><p class="sub" data-i="seSub"></p>
    <div class="panel">
      <label class="lbl" for="nhrIn" data-i="nhrLbl" style="margin-top:0"></label>
      <div class="srow"><input class="inp" id="nhrIn" inputmode="text" autocomplete="off" placeholder="NHR-XXXXXXXXX or 16-digit NID" />
        <button class="btn ghost" id="qrBtn"><svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M4 12h16"/></svg><span data-i="scanQr"></span></button>
        <button class="btn" id="seBtn" data-i="seBtn"></button></div>
      <div class="err" id="seErr" role="alert"></div>
    </div>
    <!-- Offline emergency QR -->
    <div class="panel" id="offBox" hidden>
      <h3 data-i="offTitle"></h3><p class="sub" style="margin:0 0 12px" data-i="offWarn"></p>
      <div class="pcm-details">
        <div class="pcm-box"><small data-i="offName"></small><b id="offName">--</b></div>
        <div class="pcm-box"><small data-i="bloodGroupLbl"></small><b id="offBlood">--</b></div>
        <div class="pcm-box"><small data-i="emPhoneLbl"></small><b id="offPhone">--</b></div>
      </div>
    </div>
    
    <!-- FOUND PATIENT CARD -->
    <div class="panel" id="found" hidden>
      <div class="patient-card-modern">
        <div class="pcm-head">
          <div class="pcm-av" id="fAv">?</div>
          <div class="pcm-info">
            <b id="fName">---</b>
            <small id="fMeta">---</small>
          </div>
          <div class="pcm-lock">
            <svg class="i" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            <span data-i="locked">Record locked</span>
          </div>
        </div>
        <div class="pcm-details">
          <div class="pcm-box">
            <small data-i="bloodGroupLbl">Blood Group</small>
            <b id="fBlood"><span class="blood-badge">N/A</span></b>
          </div>
          <div class="pcm-box">
            <small data-i="emContactLbl">Emergency Contact</small>
            <b id="fEmContact">None</b>
          </div>
          <div class="pcm-box">
            <small data-i="emPhoneLbl">Contact Phone</small>
            <b id="fEmPhone">--</b>
          </div>
        </div>
      </div>

      <h3 style="margin-top:22px" data-i="vTitle"></h3><p class="sub" style="margin:0 0 14px" data-i="vSub"></p>
      <div class="vm" id="vm"></div>
      <div class="vbody" id="vbody" hidden></div>
    </div>
    <div class="panel"><h3 data-i="recent"></h3><div id="recentList"></div></div>
  </section>

  <!-- Open patient -->
  <section class="sec" id="sec-patient"><div id="pView"></div></section>

  <!-- Appointments -->
  <section class="sec" id="sec-appointments">
    <h2><span data-i="nAppointments"></span></h2><p class="sub" data-i="apSub"></p>
    <div class="panel"><h3 data-i="apToday"></h3><div id="apList"></div></div>
  </section>

  <!-- Access log -->
  <section class="sec" id="sec-audit">
    <h2 data-i="auTitle"></h2><p class="sub" data-i="auSub"></p>
    <div class="panel" id="auList"></div>
  </section>

  <!-- Profile -->
  <section class="sec" id="sec-profile">
    <h2 data-i="prTitle"></h2><p class="sub" data-i="prSub"></p>
    <div class="panel">
      <div class="g2"><div><label class="lbl" style="margin-top:0" data-i="pName"></label><input class="inp" id="pfName" readonly></div>
        <div><label class="lbl" style="margin-top:0" data-i="pBmdc"></label><input class="inp" id="pfBmdc" readonly></div></div>
      <label class="lbl" data-i="pDegree"></label><input class="inp" id="pfDegree" maxlength="120" placeholder="MBBS, FCPS (Medicine)">
      <div class="g2"><div><label class="lbl" data-i="pSpec"></label><input class="inp" id="pfSpec" maxlength="80" list="specList"><datalist id="specList"><option value="Medicine"><option value="Cardiology"><option value="Neurology"><option value="Orthopedics"><option value="Pediatrics"><option value="Gynecology"><option value="Dermatology"><option value="ENT"><option value="Eye"><option value="Psychiatry"><option value="Surgery"><option value="Dental"></datalist></div>
        <div><label class="lbl" data-i="pHosp"></label><input class="inp" id="pfHosp" maxlength="120"></div></div>
      <div class="g2"><div><label class="lbl" data-i="pFee"></label><input class="inp" id="pfFee" maxlength="40" placeholder="1000 BDT"></div>
        <div><label class="lbl" data-i="pSchedule"></label><input class="inp" id="pfSchedule" maxlength="120" placeholder="Sat - Wed, 5 PM - 9 PM"></div></div>
      <p class="sub" style="margin:12px 0 0;font-size:13px" data-i="pLocked"></p>
      <div class="err" id="pfErr" role="alert"></div>
      <button class="btn" id="pfSave" data-i="save"></button>
    </div>
  </section>

  <!-- Settings & privacy -->
  <section class="sec" id="sec-settings">
    <h2 data-i="nSettings"></h2><p class="sub" data-i="setSub"></p>
    <div class="panel"><h3 data-i="chPw"></h3>
      <label class="lbl" style="margin-top:0" data-i="curPw"></label><div class="pwrap"><input type="password" class="inp" id="pwCur" autocomplete="current-password"><button type="button" class="eye" data-eye="pwCur"></button></div>
      <label class="lbl" data-i="newPw"></label><div class="pwrap"><input type="password" class="inp" id="pwNew" autocomplete="new-password"><button type="button" class="eye" data-eye="pwNew"></button></div>
      <div class="err" id="pwErr" role="alert"></div><button class="btn" id="pwBtn" data-i="updatePw"></button>
    </div>
    <div class="panel"><h3 data-i="secTitle"></h3>
      <div class="setrow"><div class="grow"><b id="fpState"></b><small data-i="fpHint"></small></div><span class="state" id="fpBadge"></span><button class="btn ghost sm" id="addFp" data-i="addFp"></button></div>
      <div class="setrow"><div class="grow"><b data-i="outAll"></b><small data-i="outAllD"></small></div><button class="btn ghost sm" id="outAllBtn" data-i="outAllB"></button></div>
    </div>
    <div class="panel"><h3 data-i="privTitle"></h3>
      <div class="setrow"><div class="grow"><b data-i="autoLock"></b><small data-i="autoLockD"></small></div><select id="lockSel"></select></div>
      <div class="setrow"><div class="grow"><b data-i="logAll"></b><small data-i="logAllD"></small></div></div>
    </div>
    <div class="panel zone"><h3 data-i="deTitle"></h3><p class="sub" style="margin-top:-6px" data-i="deDesc"></p><button class="btn red" id="deBtn" data-i="deBtn"></button></div>
  </section>
</main>

<!-- QR scanner -->
<div class="modal" id="scanModal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="scH">
    <h3 id="scH" data-i="scTitle"></h3><p data-i="scHelp"></p>
    <video class="vid" id="scanVid" playsinline webkit-playsinline muted autoplay style="background:#0c2d48;width:100%;max-height:260px;object-fit:cover;border-radius:14px"></video>
    <canvas id="scanCv" hidden></canvas>
    <div style="margin:10px 0 4px">
      <input type="file" id="scanFile" accept="image/*" capture="environment" hidden>
      <button type="button" class="btn ghost sm" id="scanPhotoBtn" style="width:100%">📷 Scan QR from Camera / Photo</button>
    </div>
    <div class="err" id="scanErr" role="alert"></div>
    <label class="lbl" data-i="scPaste"></label>
    <div class="srow"><input class="inp" id="scanTxt" style="font-size:15px;letter-spacing:0" placeholder="NHR:0000000000000000"><button class="btn sm" id="scanUse" data-i="scUse"></button></div>
    <div class="mrow"><button class="btn ghost" id="scanClose" data-i="close"></button></div>
  </div>
</div>

<!-- Deactivate -->
<div class="modal" id="deModal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="deH">
    <h3 id="deH" data-i="deHead"></h3>
    <ul class="dinfo" id="deInfo"></ul>
    <label class="lbl" data-i="deHow" style="margin-top:4px"></label><div class="opts" id="deDays"></div>
    <label class="lbl" data-i="deWhy"></label><div class="opts" id="deWhy"></div>
    <input class="inp" id="deNote" maxlength="80" hidden>
    <label class="lbl" data-i="dePw"></label><input class="inp" type="password" id="dePw" autocomplete="current-password">
    <div class="err" id="deErr" role="alert"></div>
    <div class="mrow"><button class="btn ghost" id="deNo" data-i="cancel"></button><button class="btn red" id="deGo" data-i="deGo"></button></div>
  </div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

let currentUser = null;
let D = { name: "Doctor", bmdc: "DOC0000", specialty: "General Medicine", hospital: "Hospital", degree: "MBBS", fee: "1000 BDT", schedule: "Sat-Wed", hasFingerprint: false };

function readDocSession() {
  for (const st of [sessionStorage, localStorage]) {
    try {
      const v = JSON.parse(st.getItem("nhr_session") || st.getItem("nhr_user") || "null");
      if (v && v.role === "doctor") return v;
    } catch (e) {}
  }
  return null;
}

auth.onAuthStateChanged(async (user) => {
  const fpSes = readDocSession();
  if (user && fpSes && fpSes.uid && user.uid !== fpSes.uid) {
    try { await auth.signOut(); } catch (e) {}
    user = null;
  }
  if (!user && !fpSes) {
    location.replace("login.html");
    return;
  }
  const activeUid = (user && user.uid) || (fpSes && fpSes.uid) || "";
  currentUser = user || (fpSes ? { uid: activeUid || ("fp_" + (fpSes.bmdc || "doc")), email: fpSes.email || "" } : null);
  try {
    let docSnap = null;
    if (activeUid) {
      const s = await db.collection("users").doc(activeUid).get();
      if (s.exists) docSnap = s;
    }
    if (!docSnap && fpSes && fpSes.bmdc) {
      const q = await db.collection("users").where("bmdc", "==", fpSes.bmdc).limit(1).get();
      if (!q.empty) docSnap = q.docs[0];
    }
    if (docSnap) {
      const uData = docSnap.data();
      if (currentUser && !currentUser.uid) currentUser.uid = docSnap.id;
      D = {
        uid: docSnap.id,
        name: uData.fullName || (fpSes && fpSes.name) || "Dr. User",
        bmdc: uData.bmdc || uData.nid || (fpSes && fpSes.bmdc) || "DOC0001",
        specialty: uData.specialty || "Medicine",
        hospital: uData.hospital || "General Hospital",
        degree: uData.degree || "MBBS",
        fee: uData.fee || "1000 BDT",
        schedule: uData.schedule || "Sat-Wed 5PM-9PM",
        hasFingerprint: !!uData.hasFingerprint
      };
      render();
      startDocLiveSync();
    } else if (fpSes) {
      D = Object.assign(D, { uid: activeUid, name: fpSes.name || "Dr. User", bmdc: fpSes.bmdc || "DOC0001", hasFingerprint: true });
      render();
    }
  } catch(e) { console.error("Profile load err:", e); }
});

function clearSession(){
  auth.signOut();
  localStorage.removeItem("nhr_session");
  sessionStorage.removeItem("nhr_session");
  try{sessionStorage.removeItem("nhr_doc_recent");localStorage.removeItem("nhr_doc_recent")}catch(e){}
}

/* ===== Wake Render backend & Fetch with timeout ===== */
fetch("/api/me").catch(() => {});
async function fetchWithTimeout(u, opts, ms = 25000) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(u, Object.assign({}, opts || {}, { signal: ctrl.signal })); }
  finally { clearTimeout(id); }
}

/* ===== Firebase Integration for API ===== */
async function api(url, body, method, access) {
  try {
    return await _apiInner(url, body, method, access);
  } catch (err) {
    return { ok: false, status: 0, data: { error: err && err.name === "AbortError" ? "timeout" : "srvErr" } };
  }
}
async function _apiInner(url, body, method, access) {
  try {
    const fbDoctorPayload = () => ({
      uid: currentUser ? currentUser.uid : "doc_fb",
      name: D ? D.name : "Doctor",
      bmdc: D ? D.bmdc : "DOC0000",
      hospital: D ? L(D.hospital) : "Hospital",
      specialty: D ? L(D.specialty) : "General Medicine"
    });
    const fbPatientPayload = () => (found && found._fb ? found._fb : { nhrId: body && body.nhrId });

    // ১. রোগী অনুসন্ধান (NHR-XXXXXXXXX অথবা 16-digit NID দিয়ে)
    if (url.includes("/doctor/search")) {
      const searchId = normSearchId(body.nhrId);
      const plainNhr = searchId.replace(/^NHR-/, "");
      let snap = await db.collection("users").where("nhrId", "==", searchId).get();
      if (snap.empty && plainNhr !== searchId) {
        snap = await db.collection("users").where("nhrId", "==", plainNhr).get();
      }
      if (snap.empty) {
        snap = await db.collection("users").where("nid", "==", searchId).get();
      }

      if (snap.empty) {
        return { ok: false, status: 404, data: { error: "nf" } };
      }

      const docSnap = snap.docs[0];
      const pData = docSnap.data();
      const resolvedNhr = pData.nhrId || pData.nid || searchId;
      return {
        ok: true,
        status: 200,
        data: {
          patient: {
            nhrId: resolvedNhr,
            maskedName: pData.fullName || pData.name || "Patient",
            age: pData.dob ? (new Date().getFullYear() - new Date(pData.dob).getFullYear()) : 30,
            gender: pData.gender || "Male",
            phoneEnd: pData.phone ? String(pData.phone).slice(-2) : "00",
            emailMasked: pData.email ? pData.email.replace(/(.{2})(.*)(?=@)/, "$1***") : "",
            bloodGroup: pData.bloodGroup || pData.health?.bloodGroup || "N/A",
            emergency: pData.emergency || pData.emergencyContact || null,
            _fb: {
              uid: docSnap.id,
              nhrId: resolvedNhr,
              nid: pData.nid || "",
              fullName: pData.fullName || pData.name || "Patient",
              email: pData.email || "",
              phone: pData.phone || "",
              prefs: pData.prefs || {}
            }
          }
        }
      };
    }

    // ২. আসল ব্যাকএন্ডের মাধ্যমে QR স্ক্যান, Gmail OTP এবং Emergency Override
    if (url.includes("fp-start")) {
      const res = await fetchWithTimeout("/api/doctor/verify/fp-start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nhrId: body.nhrId, fbPatient: fbPatientPayload(), fbDoctor: fbDoctorPayload() })
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }
    if (url.includes("fp-status")) {
      const sep = url.includes("?") ? "&" : "?";
      const res = await fetchWithTimeout(url + sep + "dt=" + encodeURIComponent(fbDoctorPayload().uid));
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.status === "approved" && currentUser && found) {
        try {
          await db.collection("access_logs").add({ doctorId: currentUser.uid, nhrId: found.nhrId, name: found.maskedName, method: "fp", when: Date.now() });
        } catch (e) {}
      }
      return { ok: res.ok, status: res.status, data };
    }
    if (url.includes("otp-send")) {
      const res = await fetchWithTimeout("/api/doctor/verify/otp-send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nhrId: body.nhrId, fbPatient: fbPatientPayload(), fbDoctor: fbDoctorPayload() })
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }
    if (url.includes("otp-verify")) {
      const res = await fetchWithTimeout("/api/doctor/verify/otp-verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nhrId: body.nhrId, code: body.code, fbPatient: fbPatientPayload(), fbDoctor: fbDoctorPayload() })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && currentUser && found) {
        try {
          await db.collection("access_logs").add({ doctorId: currentUser.uid, nhrId: found.nhrId, name: found.maskedName, method: "otp", when: Date.now() });
        } catch (e) {}
      }
      return { ok: res.ok, status: res.status, data };
    }
    if (url.includes("emergency")) {
      const res = await fetchWithTimeout("/api/doctor/verify/emergency", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nhrId: body.nhrId, reason: body.reason, note: body.note, fbPatient: fbPatientPayload(), fbDoctor: fbDoctorPayload() })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && currentUser && found) {
        try {
          await db.collection("access_logs").add({ doctorId: currentUser.uid, nhrId: found.nhrId, name: found.maskedName, method: "em", when: Date.now() });
        } catch (e) {}
      }
      return { ok: res.ok, status: res.status, data };
    }

    // ৩. রোগীর ফুল রেকর্ড লোড করা
    if (url.includes("/doctor/patient")) {
      let pObj = { fullName: found.maskedName, nhrId: body.nhrId, age: 30, gender: "Male", bloodGroup: "B+" };
      const pSnap = await db.collection("users").where("nhrId", "==", body.nhrId).get();
      if (!pSnap.empty) pObj = pSnap.docs[0].data();

      // রেকর্ডস ও প্রেসক্রিপশন নিয়ে আসা
      const recSnap = await db.collection("records").where("nhrId", "==", body.nhrId).get();
      const recordsList = recSnap.docs.map(doc => doc.data());

      return {
        ok: true,
        status: 200,
        data: {
          patient: pObj,
          allergies: pObj.allergies || [{ name: bi("Penicillin", "পেনিসিলিন"), sev: "high", note: bi("Breathing trouble", "শ্বাসকষ্ট") }],
          conditions: pObj.conditions || [bi("Mild Asthma", "হালকা হাঁপানি")],
          meds: pObj.meds || [bi("Salbutamol Inhaler", "স্যালবুটামল ইনহেলার")],
          vitals: pObj.vitals || { dates: ["Jun", "Jul", "Aug", "Sep", "Oct"], bp: [120, 122, 118, 124, 120], glucose: [5.2, 5.5, 5.4, 5.8, 5.5] },
          records: recordsList
        }
      };
    }

    // ৪. প্রেসক্রিপশন/মেডিকেল রেকর্ড Firestore-এ সেভ করা
    if (url.includes("/doctor/records")) {
      await db.collection("records").add({
        ...body,
        doctorId: currentUser ? currentUser.uid : "dr_001",
        doctorName: D ? D.name : "Dr. User",
        date: todayStr(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // অ্যাক্সেস লগে সেভ
      if (currentUser && S) {
        await db.collection("access_logs").add({
          doctorId: currentUser.uid,
          nhrId: S.nhrId,
          name: S.name,
          method: method || "otp",
          when: Date.now()
        });
      }
      return { ok: true, status: 200, data: {} };
    }

    // ৫. ডাক্তার প্রোফাইল আপডেট
    if (url.includes("/doctor/profile")) {
      if (body && currentUser) {
        await db.collection("users").doc(currentUser.uid).update({
          specialty: body.speciality,
          hospital: body.hospital,
          degree: body.degree,
          fee: body.fee,
          schedule: body.schedule
        });
      }
      return { ok: true, status: 200, data: { profile: D } };
    }

    // ৬. অ্যাক্সেস লগ ও ব্লাড ডোনার
    if (url.includes("/doctor/audit")) {
      const snap = await db.collection("access_logs").orderBy("when", "desc").limit(10).get();
      const logs = snap.docs.map(d => d.data());
      return { ok: true, status: 200, data: { log: logs } };
    }
    if (url.includes("/doctor/donors")) {
      const snap = await db.collection("users").where("role", "==", "donor").get();
      const donors = snap.docs.map(d => d.data());
      return { ok: true, status: 200, data: { donors } };
    }
    if (url.includes("/doctor/appointments")) {
      return { ok: true, status: 200, data: { list: APPTS } };
    }

  } catch(e) {
    console.error("Firestore operation error:", e);
    return { ok: false, status: 500, data: { error: "srvErr" } };
  }

  return { ok: true, status: 200, data: {} };
}

/* ===== QR scanner ===== */
function ensureJsQr() {
  if (window.jsQR) return Promise.resolve(true);
  return new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
    s.onload = () => resolve(!!window.jsQR);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

function parseQr(text){
  const raw=String(text||"").trim();
  const off=raw.match(/^NHR-EMERGENCY:([A-Za-z0-9+/=_-]+)$/i);
  if(off){
    try{
      const bin=atob(off[1].replace(/-/g,"+").replace(/_/g,"/"));
      const j=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,(c)=>c.charCodeAt(0))));
      const rawId=String(j.id||"").trim().toUpperCase();
      const numId=digits(rawId);
      const validId=/^NHR-[A-Z0-9]{6,12}$/.test(rawId)?rawId:(numId.length===12||numId.length===16?numId:"");
      if(validId)return{id:validId,offline:{name:String(j.name||"").slice(0,80),blood:String(j.blood||"").slice(0,4),phone:String(j.em||"").slice(0,20)}};
    }catch(e){}
    return null;
  }
  const m=raw.match(/(NHR-[A-Z0-9]{6,12})/i)||raw.match(/NHR:?s*(d{12}|d{16})/i)||raw.match(/^s*(d{12}|d{16})s*$/);
  return m?{id:m[1].toUpperCase()}:null;
}
function showOffline(o){
  $("offBox").hidden=!o;if(!o)return;
  $("offName").textContent=o.name||"–";$("offBlood").textContent=o.blood||"–";$("offPhone").textContent=o.phone||"–";
}
function stopScan(){cancelAnimationFrame(scanRaf);if(scanStream){scanStream.getTracks().forEach((x)=>x.stop());scanStream=null}$("scanModal").hidden=true}
function gotQr(text){
  const q=parseQr(text);if(!q){$("scanErr").textContent=t("scBad");return false}
  stopScan();show("search");$("nhrIn").value=groups(q.id);showOffline(q.offline);doSearch(q.id,true);return true;
}

async function decodeImageSource(srcEl, w, h) {
  if ("BarcodeDetector" in window) {
    try {
      const bd = new BarcodeDetector({ formats: ["qr_code"] });
      const codes = await bd.detect(srcEl);
      if (codes && codes.length && codes[0].rawValue) return codes[0].rawValue;
    } catch (e) {}
  }
  await ensureJsQr();
  if (window.jsQR && w > 0 && h > 0) {
    const cv = $("scanCv"), cx = cv.getContext("2d", { willReadFrequently: true });
    cv.width = w; cv.height = h;
    cx.drawImage(srcEl, 0, 0, w, h);
    const img = cx.getImageData(0, 0, w, h);
    const c = jsQR(img.data, img.width, img.height);
    if (c && c.data) return c.data;
  }
  return null;
}

$("qrBtn").onclick=async()=>{
  $("scanErr").textContent="";$("scanTxt").value="";$("scanModal").hidden=false;
  const v=$("scanVid");
  v.setAttribute("playsinline","true");
  v.setAttribute("webkit-playsinline","true");
  v.muted=true;
  v.hidden=false;
  ensureJsQr();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    v.hidden=true;
    $("scanErr").textContent=lang==="bn"?"লাইভ ক্যামেরা সাপোর্ট করছে না। নিচের বাটন দিয়ে QR ছবি তুলে স্ক্যান করুন।":"Live camera unavailable. Tap 'Scan QR from Camera / Photo' below.";
    return;
  }
  try{
    try {
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    } catch (firstErr) {
      scanStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    }
    v.srcObject=scanStream;
    await v.play();
    let busy=false;
    const loop=async()=>{
      if(!scanStream)return;
      if(!busy && v.readyState>=2 && v.videoWidth>0){
        busy=true;
        try {
          const val = await decodeImageSource(v, v.videoWidth, v.videoHeight);
          if (val && gotQr(val)) return;
        } catch(e){}
        busy=false;
      }
      scanRaf=requestAnimationFrame(loop);
    };loop();
  }catch(e){
    v.hidden=true;
    $("scanErr").textContent=lang==="bn"?"লাইভ ক্যামেরা চালু হয়নি। নিচের বাটন দিয়ে QR ছবি তুলে স্ক্যান করুন।":"Camera permission blocked. Tap 'Scan QR from Camera / Photo' below.";
  }
};

  const img=new Image();

    try{
      const scale=Math.min(1, 1000/Math.max(img.width,img.height));

    }finally{URL.revokeObjectURL(url)}

const DRUG_CLASSES={
  penicillin:["penicillin","amoxicillin","ampicillin","amoxiclav","augmentin","cloxacillin","flucloxacillin","piperacillin"],
  sulfa:["sulfa","sulfamethoxazole","cotrimoxazole","co-trimoxazole","bactrim"],
  nsaid:["nsaid","aspirin","ibuprofen","diclofenac","naproxen","ketorolac","piroxicam","indomethacin"],
  cephalosporin:["cephalosporin","cefixime","ceftriaxone","cefuroxime","cefpodoxime","cephalexin","cefadroxil","cefotaxime"]
};
function allergyTerms(name){
  const n=String(name).toLowerCase(),terms=new Set([n]);
  for(const k in DRUG_CLASSES)if(n.includes(k)||DRUG_CLASSES[k].some((x)=>n.includes(x)))DRUG_CLASSES[k].forEach((x)=>terms.add(x));
  return[...terms];
}
const reEsc=(x)=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function mentions(med,term){
  const re=new RegExp("(?<![a-z])"+reEsc(term)+(term==="sulfa"?"(?!te|ts)":""),"i");
  return re.test(med);
}
function conflicts(){
  if(RX.type!=="rx")return[];
  const out=[];
  (S.data.allergies||[]).forEach((a)=>{
    const an=a.name&&typeof a.name==="object"?a.name.en:a.name,terms=allergyTerms(an);
    RX.meds.forEach((m)=>{const ml=String(m.name);if(ml.trim()&&terms.some((x)=>mentions(ml,x)))out.push({med:ml.trim().slice(0,60),allergy:an,sev:a.sev})});
  });
  return out;
}

async function saveRecord(){
  const e=$("adE");e.textContent="";
  const meds=RX.meds.filter((m)=>m.name.trim()),isRx=RX.type==="rx";
  if(RX.title.trim().length<2||(isRx?!meds.length:RX.detail.trim().length<2)){e.textContent=t("adNeed");return}
  const c=conflicts();if(c.length&&RX.override.trim().length<5){e.textContent=t("alNeedReason");return}
  let notes=RX.notes.trim();if(c.length)notes=(notes?notes+" ":"")+"[Allergy override: "+RX.override.trim()+"]";
  const body={nhrId:S.nhrId,type:RX.type,title:RX.title.trim()};
  if(isRx){body.items=meds.map((m)=>({name:m.name.trim(),dose:m.dose.trim(),freq:m.freq.trim(),duration:m.duration.trim()}));body.notes=notes}else body.detail=RX.detail.trim();
  $("adSave").disabled=true;const r=await api("/api/doctor/records",body,"POST",S.token);$("adSave").disabled=false;
  if(!r.ok){e.textContent=t(r.status===403?"expired":"srvErr");return}
  const detail=isRx?body.items.map((i)=>i.name+(i.dose?" "+i.dose:"")+(i.freq?" - "+i.freq:"")+(i.duration?" - "+i.duration:"")).join("; ")+(notes?". "+notes:""):body.detail;
  const rec={date:todayStr(),type:RX.type,title:body.title,by:D.name,detail};
  if(window.db && S && S.nhrId){
    try {
      await db.collection("records").add({ ...rec, nhrId: S.nhrId, doctorId: D.bmdc || "", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      const bpVal = parseFloat(RX.bp), gluVal = parseFloat(RX.glucose), hbaVal = parseFloat(RX.hba1c);
      if(!isNaN(bpVal) || !isNaN(gluVal) || !isNaN(hbaVal)){
        const monthKey = todayStr().slice(0, 7);
        const normVId = String(S.nhrId).replace(/[^A-Z0-9]/gi, "");
        const vRef = db.collection("vitals").doc(normVId);
        await db.runTransaction(async (tx) => {
          const snap = await tx.get(vRef);
          const v = snap.exists ? snap.data() : { dates: [], bp: [], glucose: [], hba1c: [] };
          const dates = Array.isArray(v.dates) ? [...v.dates] : [];
          const bp = Array.isArray(v.bp) ? [...v.bp] : [];
          const glucose = Array.isArray(v.glucose) ? [...v.glucose] : [];
          const hba1c = Array.isArray(v.hba1c) ? [...v.hba1c] : [];
          let idx = dates.indexOf(monthKey);
          if(idx === -1){ idx = dates.length; dates.push(monthKey); bp.push(null); glucose.push(null); hba1c.push(null); }
          if(!isNaN(bpVal)) bp[idx] = bpVal;
          if(!isNaN(gluVal)) glucose[idx] = gluVal;
          if(!isNaN(hbaVal)) hba1c[idx] = hbaVal;
          tx.set(vRef, { dates, bp, glucose, hba1c, updatedAt: new Date().toISOString() }, { merge: true });
        });
      }
    } catch(ve) { console.error("Firestore record/vitals sync error:", ve); }
  }
  (S.data.records=S.data.records||[]).push(rec);
  RX={type:"rx",title:"",notes:"",detail:"",meds:[{name:"",dose:"",freq:"",duration:""}],override:"",bp:"",glucose:"",hba1c:""};
  toast(t("adOk"));notify("recAdded",S.name);tab="tl";renderPatient();
}

      AUD=snap.docs.map(d=>d.data()).sort((a,b)=>Number(b.at||b.when||0)-Number(a.at||a.when||0));

  const dm=e.target.closest("[data-delmed]");if(dm){RX.meds.splice(+dm.dataset.delmed,1);if(!RX.meds.length)RX.meds.push({name:"",dose:"",freq:"",duration:""});renderPatient();return}
  if(e.target.id==="adSave")saveRecord();
});
document.querySelectorAll(".lang button").forEach((b)=>b.addEventListener("click",()=>{lang=b.dataset.l;localStorage.setItem("nhr_lang",lang);render()}));
$("logout").onclick=async()=>{try{await auth.signOut()}catch(e){}clearSession();location.href="login.html"};
window.addEventListener("pagehide",()=>{S=null;stopScan()});

(async()=>{
  render();
})();
</script>
